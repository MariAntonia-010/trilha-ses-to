{id:1,d:"Legislação (SUS)",a:"CF/88 – art. 198",q:"Segundo o art. 198 da Constituição Federal, uma das diretrizes do SUS é:",o:["Centralização da gestão no nível federal.","Atendimento integral, com prioridade para as atividades preventivas, sem prejuízo dos serviços assistenciais.","Participação da comunidade apenas como consulta, sem deliberação.","Financiamento exclusivo pela União."],c:1,n:["Errada: a diretriz é a descentralização, com direção única em cada esfera.","Correta: art. 198, II.","Errada: a participação da comunidade é diretriz, e a Lei 8.142 dá ao Conselho caráter deliberativo.","Errada: o financiamento é tripartite (art. 198, §1º)."],ref:"CF/1988, art. 198, I a III e §1º",dica:"Memorize as três diretrizes: descentralização, atendimento integral e participação da comunidade.",lv:"Fácil"},
{id:2,d:"Legislação (SUS)",a:"Lei 8.142/1990",q:"De acordo com a Lei nº 8.142/1990, o Conselho de Saúde atua em caráter:",o:["Eventual e consultivo.","Permanente e deliberativo.","Permanente e apenas consultivo.","Eventual e deliberativo."],c:1,n:["Errada: não é eventual nem só consultivo.","Correta: órgão colegiado permanente e deliberativo (art. 1º, §2º).","Errada: é permanente, mas deliberativo.","Errada: é deliberativo, mas permanente. A Conferência é que se reúne a cada 4 anos."],ref:"Lei 8.142/1990, art. 1º, §§1º e 2º",dica:"Conferência = a cada 4 anos. Conselho = permanente e deliberativo.",lv:"Fácil"},
{id:3,d:"Legislação (SUS)",a:"Lei 8.080/1990 – princípios",q:"O princípio do SUS que prevê “conjunto articulado e contínuo de ações e serviços preventivos e curativos, individuais e coletivos, exigidos para cada caso em todos os níveis de complexidade” é a:",o:["Universalidade de acesso.","Integralidade de assistência.","Preservação da autonomia das pessoas.","Divulgação de informações sobre o potencial dos serviços."],c:1,n:["Errada: universalidade é o acesso a todos os níveis de assistência.","Correta: é a definição de integralidade (art. 7º, II).","Errada: trata da defesa da integridade física e moral.","Errada: trata do direito à informação do usuário."],ref:"Lei 8.080/1990, art. 7º, I, II, III e V",dica:"Associe “articulado e contínuo” a integralidade.",lv:"Médio"},
{id:4,d:"Legislação (SUS)",a:"Decreto 7.508/2011",q:"No Decreto nº 7.508/2011, o espaço geográfico contínuo constituído por agrupamentos de Municípios limítrofes, para integrar a organização, o planejamento e a execução de ações e serviços de saúde, é denominado:",o:["Região de Saúde.","Contrato Organizativo da Ação Pública.","Porta de Entrada.","Mapa da Saúde."],c:0,n:["Correta: art. 2º, I.","Errada: o COAP é o acordo de colaboração entre entes federativos (art. 2º, II).","Errada: são os serviços de atendimento inicial ao usuário (art. 2º, III).","Errada: é a descrição geográfica da distribuição de recursos e ações (art. 2º, V)."],ref:"Decreto 7.508/2011, art. 2º, I a V",dica:"Leia o art. 2º inteiro: a FGV cobra definições.",lv:"Médio"},
{id:5,d:"Serviço Social",a:"Código de Ética (1993)",q:"Entre os princípios fundamentais do Código de Ética do/a Assistente Social (1993), o valor ético central é:",o:["A neutralidade profissional.","A liberdade.","O assistencialismo.","A eficiência institucional."],c:1,n:["Errada: o Código defende posicionamento ético-político, não neutralidade.","Correta: reconhecimento da liberdade como valor ético central.","Errada: o projeto ético-político se opõe a práticas tuteladoras.","Errada: eficiência não é o valor central do Código."],ref:"Código de Ética do/a Assistente Social (Res. CFESS 273/1993), Princípios Fundamentais",dica:"Liberdade, autonomia, emancipação e plena expansão dos indivíduos sociais.",lv:"Fácil"},
{id:6,d:"Serviço Social",a:"Sigilo profissional",q:"Segundo o Código de Ética do/a Assistente Social, a quebra do sigilo profissional é admissível quando:",o:["Qualquer autoridade a requisitar, independentemente da gravidade.","O empregador solicitar informações sobre o usuário.","Houver situação de gravidade que possa trazer prejuízo aos interesses do usuário, de terceiros e da coletividade.","Nunca, em nenhuma hipótese."],c:2,n:["Errada: a requisição por si só não afasta o dever de sigilo.","Errada: o vínculo empregatício não autoriza a quebra.","Correta: art. 18.","Errada: o Código prevê exceção de gravidade (art. 18)."],ref:"Código de Ética (1993), Cap. V – Do Sigilo Profissional, art. 18",dica:"Sigilo é regra; a quebra é exceção justificada pela gravidade.",lv:"Médio"},
{id:7,d:"Serviço Social",a:"ECA – Conselho Tutelar",q:"De acordo com o ECA, o Conselho Tutelar é órgão:",o:["Do Poder Judiciário, com poder de aplicar penas.","Permanente e autônomo, não jurisdicional, encarregado de zelar pelos direitos da criança e do adolescente.","Temporário e subordinado ao Executivo.","Do Ministério Público."],c:1,n:["Errada: não é jurisdicional.","Correta: art. 131.","Errada: é permanente e autônomo.","Errada: não integra o Ministério Público."],ref:"Lei 8.069/1990 (ECA), art. 131",dica:"Palavras-chave: permanente, autônomo, não jurisdicional.",lv:"Fácil"},
{id:8,d:"Raciocínio Lógico e Matemático",a:"Pontuação da prova",q:"Na prova (Módulo I: 1 ponto por questão; Módulo II: 2 pontos), uma candidata acertou 18 das 30 questões do Módulo I e 21 das 30 do Módulo II. Sua nota total foi:",o:["54","60","78","39"],c:1,n:["Errada: 18 + 21 × 2 = 60, não 54.","Correta: 18×1 + 21×2 = 18 + 42 = 60.","Errada: somou pontos sem a ponderação correta.","Errada: 18 + 21 = 39 ignora o peso 2."],ref:"Edital 001/2026, item 11.6.3.1",dica:"Calcule por módulo, depois some.",lv:"Fácil"},
{id:9,d:"Legislação (SUS)",a:"Lei 8.080/1990 – art. 3º",q:"Segundo o art. 3º da Lei nº 8.080/1990, os níveis de saúde expressam a organização social e econômica do País e têm como determinantes e condicionantes, entre outros:",o:["Moradia, saneamento básico, trabalho, renda, educação e transporte.","Exclusivamente a assistência médica hospitalar.","Apenas fatores biológicos e genéticos.","Somente a renda per capita."],c:0,n:["Correta: art. 3º (rol exemplificativo, ampliado pela Lei 12.864/2013 com a atividade física).","Errada: o conceito é ampliado, não se limita à assistência.","Errada: a lei inclui fatores sociais e econômicos.","Errada: renda é apenas um dos fatores."],ref:"Lei 8.080/1990, art. 3º e parágrafo único",dica:"Pense em “determinantes sociais”: tudo o que condiciona a saúde fora do hospital.",lv:"Fácil"},
{id:10,d:"Legislação (SUS)",a:"Iniciativa privada no SUS",q:"De acordo com a Constituição Federal e a Lei nº 8.080/1990, a participação da iniciativa privada no SUS ocorre em caráter:",o:["Substitutivo do poder público.","Complementar.","Preferencial.","Vedado em qualquer hipótese."],c:1,n:["Errada: o setor privado não substitui o público.","Correta: CF, art. 199, §1º; Lei 8.080, art. 4º, §2º.","Errada: a CF dá preferência às entidades filantrópicas e sem fins lucrativos, mas só entre as privadas, e de forma complementar.","Errada: a participação complementar é permitida, mediante contrato ou convênio."],ref:"CF/1988, art. 199, §1º; Lei 8.080/1990, art. 4º, §2º",dica:"Privado no SUS = complementar, nunca substitutivo.",lv:"Médio"},
{id:11,d:"Serviço Social",a:"Lei 8.662/1993",q:"De acordo com a Lei nº 8.662/1993, é atribuição privativa do assistente social:",o:["Prestar orientação social a indivíduos, grupos e à população.","Realizar vistorias, perícias técnicas, laudos periciais, informações e pareceres sobre a matéria de Serviço Social.","Realizar exames clínicos para diagnóstico.","Emitir parecer sobre matéria de Psicologia."],c:1,n:["Errada: é competência (art. 4º), não atribuição privativa.","Correta: art. 5º, IV.","Errada: não é matéria do Serviço Social.","Errada: é matéria de outra profissão."],ref:"Lei 8.662/1993, arts. 4º e 5º",dica:"Art. 4º = competências. Art. 5º = atribuições privativas. A FGV gosta de trocar um pelo outro.",lv:"Difícil"},
{id:12,d:"Serviço Social",a:"Código de Ética – direitos",q:"Constitui direito do assistente social, segundo o Código de Ética de 1993:",o:["O aprimoramento profissional de forma contínua.","Ser obrigado a prestar serviços incompatíveis com suas atribuições.","Revelar o sigilo quando o empregador solicitar.","Aceitar determinação institucional, ainda que contrária ao Código."],c:0,n:["Correta: art. 2º, f.","Errada: o direito é o oposto, a ampla autonomia para não prestar serviços incompatíveis (art. 2º, h).","Errada: o sigilo protege o usuário (arts. 15 a 18).","Errada: o Código prevalece sobre determinações contrárias a ele."],ref:"Código de Ética (1993), art. 2º",dica:"Leia o art. 2º (direitos) e o art. 3º (deveres) como listas separadas.",lv:"Médio"},
{id:13,d:"Serviço Social",a:"Princípios fundamentais",q:"É princípio fundamental do Código de Ética do/a Assistente Social (1993):",o:["Defesa intransigente dos direitos humanos e recusa do arbítrio e do autoritarismo.","Neutralidade diante dos conflitos sociais.","Ampliação do poder de tutela sobre os usuários.","Primazia da eficiência institucional sobre os direitos."],c:0,n:["Correta: é um dos princípios fundamentais.","Errada: o Código assume posicionamento em favor da equidade e da justiça social.","Errada: contraria a autonomia e a emancipação.","Errada: o Código prioriza os direitos dos usuários."],ref:"Código de Ética (1993), Princípios Fundamentais",dica:"Se a alternativa fala em neutralidade, tutela ou autoritarismo, desconfie.",lv:"Fácil"},
{id:14,d:"Serviço Social",a:"ECA – proteção integral",q:"De acordo com o ECA, é dever de quem assegurar, com absoluta prioridade, os direitos das crianças e dos adolescentes?",o:["Exclusivamente da família.","Exclusivamente do Estado.","Da família, da comunidade, da sociedade em geral e do Poder Público.","Exclusivamente do Conselho Tutelar."],c:2,n:["Errada: a responsabilidade é compartilhada.","Errada: a família e a sociedade também respondem.","Correta: art. 4º.","Errada: o Conselho Tutelar fiscaliza e zela, mas não é o único responsável."],ref:"Lei 8.069/1990, art. 4º",dica:"Quatro sujeitos: família, comunidade, sociedade e Poder Público.",lv:"Fácil"},
{id:15,d:"Serviço Social",a:"ECA – conceitos",q:"Para os efeitos do ECA, considera-se criança a pessoa até:",o:["10 anos de idade incompletos.","12 anos de idade incompletos.","14 anos de idade incompletos.","16 anos de idade incompletos."],c:1,n:["Errada.","Correta: art. 2º. Adolescente é quem tem entre doze e dezoito anos de idade.","Errada.","Errada."],ref:"Lei 8.069/1990, art. 2º",dica:"Criança: até 12 incompletos. Adolescente: de 12 a 18.",lv:"Fácil"},
{id:16,d:"Serviço Social",a:"LOAS",q:"Segundo a Lei Orgânica da Assistência Social (Lei nº 8.742/1993), a assistência social é política de seguridade social:",o:["Contributiva.","Não contributiva.","Condicionada a contribuição prévia ao INSS.","Exclusiva para trabalhadores formais."],c:1,n:["Errada: quem é contributiva é a previdência social.","Correta: art. 1º. Direito do cidadão e dever do Estado.","Errada: não exige contribuição.","Errada: destina-se a quem dela necessitar."],ref:"Lei 8.742/1993, art. 1º; CF/1988, art. 203",dica:"Saúde e assistência: sem contribuição. Previdência: contributiva.",lv:"Fácil"},
{id:17,d:"Serviço Social",a:"Seguridade Social",q:"A Constituição Federal define a seguridade social como conjunto integrado de ações destinadas a assegurar direitos relativos:",o:["À saúde, à previdência e à assistência social.","À saúde, à educação e à habitação.","À previdência, ao trabalho e à segurança pública.","À assistência, à educação e à cultura."],c:0,n:["Correta: art. 194.","Errada: educação e habitação não integram a seguridade.","Errada: trabalho e segurança pública não integram.","Errada: educação e cultura não integram."],ref:"CF/1988, art. 194",dica:"Tripé da seguridade: saúde, previdência, assistência.",lv:"Fácil"},
{id:18,d:"Língua Portuguesa",a:"Concordância verbal",q:"Assinale a frase em que a concordância verbal está de acordo com a norma-padrão.",o:["Fazem dois anos que a lei foi publicada.","Houveram muitas inscrições no último dia.","Existem vagas reservadas para pessoas com deficiência.","Devem haver vagas para todos os candidatos."],c:2,n:["Errada: fazer indicando tempo é impessoal: “Faz dois anos”.","Errada: haver no sentido de existir é impessoal: “Houve”.","Correta: existir é pessoal e concorda com “vagas”.","Errada: locução com haver impessoal: “Deve haver”."],ref:"Gramática normativa: concordância verbal",dica:"Haver (existir/ocorrer) e fazer (tempo) não vão ao plural.",lv:"Médio"},
{id:19,d:"Raciocínio Lógico e Matemático",a:"Porcentagem",q:"Uma candidata acertou 15 das 20 questões de um simulado. Seu percentual de acerto foi de:",o:["65%","70%","75%","80%"],c:2,n:["Errada: 13 acertos.","Errada: 14 acertos.","Correta: 15/20 = 0,75.","Errada: 16 acertos."],ref:"Porcentagem",dica:"Divida acertos por total e multiplique por 100.",lv:"Fácil"},
{id:20,d:"Raciocínio Lógico e Matemático",a:"Negação de proposições",q:"A negação lógica de “Todos os candidatos estudaram” é:",o:["Nenhum candidato estudou.","Algum candidato não estudou.","Todos os candidatos não estudaram.","Algum candidato estudou."],c:1,n:["Errada: é uma negação forte demais.","Correta: negar “todo” é “existe pelo menos um que não”.","Errada: equivale a “nenhum estudou”.","Errada: pode ser verdadeira junto com a original."],ref:"Lógica proposicional: negação de quantificadores",dica:"Negar “todo” vira “algum não”. Negar “algum” vira “nenhum”.",lv:"Médio"},
{id:21,d:"História e Geografia do TO",a:"Criação do Estado",q:"O Estado do Tocantins foi criado por meio:",o:["Da Constituição Federal de 1988, com desmembramento do norte de Goiás.","De emenda constitucional de 1995.","De lei complementar de 1990.","De plebiscito realizado em 1993."],c:0,n:["Correta: ADCT, art. 13. A instalação ocorreu em 1º de janeiro de 1989.","Errada.","Errada.","Errada: o plebiscito de 1993 tratou da forma de governo."],ref:"ADCT/CF 1988, art. 13",dica:"Criado em 1988, instalado em 1989.",lv:"Fácil"},
{id:22,d:"Legislação (SUS)",a:"Política Nacional de Humanização",q:"Está entre as diretrizes da Política Nacional de Humanização (PNH):",o:["Acolhimento.","Fragmentação do cuidado entre equipes.","Exclusão dos familiares das decisões.","Hierarquização rígida sem cogestão."],c:0,n:["Correta: o acolhimento é diretriz central.","Errada: a PNH propõe cuidado integrado.","Errada: a PNH valoriza a rede de apoio.","Errada: a PNH defende a cogestão."],ref:"Ministério da Saúde, Política Nacional de Humanização (HumanizaSUS)",dica:"Outras diretrizes: clínica ampliada, cogestão, ambiência, defesa dos direitos dos usuários.",lv:"Médio"},
{id:23,d:"Serviço Social",a:"Parâmetros CFESS na saúde",q:"Os Parâmetros para Atuação de Assistentes Sociais na Política de Saúde (CFESS) organizam a atuação em eixos. NÃO é um desses eixos:",o:["Atendimento direto aos usuários.","Mobilização, participação e controle social.","Investigação, planejamento e gestão.","Fiscalização sanitária de estabelecimentos."],c:3,n:["É eixo.","É eixo.","É eixo.","Correta: não é eixo. O quarto é assessoria, qualificação e formação profissional."],ref:"CFESS, Parâmetros para Atuação de Assistentes Sociais na Política de Saúde (2010)",dica:"Quatro eixos: atendimento direto; mobilização e controle social; investigação, planejamento e gestão; assessoria e formação.",lv:"Médio"},
{id:24,d:"Legislação (SUS)",a:"Lei 8.080 – objetivos (art. 5º)",q:"Constitui objetivo do SUS, segundo a Lei nº 8.080/1990:",o:["Substituir a atuação da iniciativa privada na saúde.","A assistência às pessoas por meio de ações de promoção, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades preventivas.","A arrecadação de contribuições previdenciárias.","A atuação exclusiva em casos de alta complexidade hospitalar."],c:1,n:["Errada: a iniciativa privada participa de forma complementar.","Correta: art. 5º, III.","Errada: não é objetivo do SUS.","Errada: o SUS atua em todos os níveis de complexidade."],ref:"Lei 8.080/1990, art. 5º",dica:"Objetivos: fatores determinantes, formulação de política e assistência integrada.",lv:"Médio"},
{id:25,d:"Legislação (SUS)",a:"Lei 8.080 – direção do SUS",q:"De acordo com a Lei nº 8.080/1990, no âmbito dos Municípios, a direção do SUS é exercida pela:",o:["Secretaria Municipal de Saúde ou órgão equivalente.","Ministério da Saúde.","Conselho Municipal de Saúde.","Comissão Intergestores Tripartite."],c:0,n:["Correta: art. 9º, III.","Errada: o Ministério dirige o SUS na União.","Errada: o Conselho delibera e controla, mas não dirige.","Errada: a CIT atua no âmbito nacional."],ref:"Lei 8.080/1990, art. 9º",dica:"Direção única em cada esfera: Ministério, Secretaria Estadual, Secretaria Municipal.",lv:"Fácil"},
{id:26,d:"Legislação (SUS)",a:"Decreto 7.508 – portas de entrada",q:"Segundo o Decreto nº 7.508/2011, é Porta de Entrada às ações e serviços de saúde nas Redes de Atenção:",o:["A atenção primária.","A atenção hospitalar eletiva.","A atenção ambulatorial especializada sob regulação.","As centrais de transplantes."],c:0,n:["Correta: art. 9º, I. As demais são urgência e emergência, atenção psicossocial e serviços especiais de acesso aberto.","Errada: depende de acesso ordenado pela porta de entrada.","Errada: o acesso especializado é ordenado pela atenção primária.","Errada: não é porta de entrada."],ref:"Decreto 7.508/2011, art. 9º",dica:"Quatro portas: primária, urgência e emergência, psicossocial e acesso aberto.",lv:"Médio"},
{id:27,d:"Legislação (SUS)",a:"Decreto 7.508 – Comissões Intergestores",q:"No Decreto nº 7.508/2011, a Comissão Intergestores Bipartite (CIB) atua no âmbito:",o:["Da União.","Do Estado.","Regional.","Municipal."],c:1,n:["Errada: a CIT atua na União.","Correta: art. 30, II, vinculada à Secretaria Estadual de Saúde.","Errada: a CIR atua no âmbito regional.","Errada: não há comissão intergestores municipal no art. 30."],ref:"Decreto 7.508/2011, art. 30",dica:"Tripartite = União, Bipartite = Estado, Regional = região de saúde.",lv:"Médio"},
{id:28,d:"Legislação (SUS)",a:"Lei 8.142 – transferências",q:"Para receberem os recursos do Fundo Nacional de Saúde, Municípios, Estados e Distrito Federal devem contar, entre outros requisitos, com:",o:["Apenas o plano de saúde.","Fundo de Saúde, Conselho de Saúde, plano de saúde e relatórios de gestão.","Somente o Fundo de Saúde.","Exclusivamente a autorização do Ministério da Saúde."],c:1,n:["Errada: o plano é só um dos requisitos.","Correta: art. 4º, I a IV.","Errada: faltam os demais requisitos.","Errada: a lei exige estrutura própria de controle social e gestão."],ref:"Lei 8.142/1990, art. 4º",dica:"Sem Fundo e Conselho de Saúde, não há repasse.",lv:"Médio"},
{id:29,d:"Serviço Social",a:"Código de Ética – deveres com usuários",q:"Nas relações com os usuários, é dever do assistente social:",o:["Impor suas crenças quando discordar da decisão do usuário.","Garantir a plena informação e discussão sobre as possibilidades e consequências das situações apresentadas, respeitando democraticamente as decisões dos usuários.","Decidir pelo usuário nas situações de conflito.","Omitir informações para evitar conflitos institucionais."],c:1,n:["Errada: o Código veda imposição de valores.","Correta: art. 5º, b.","Errada: fere a autonomia.","Errada: o dever é garantir a plena informação."],ref:"Código de Ética (1993), art. 5º",dica:"Autonomia do usuário: informar, discutir e respeitar a decisão.",lv:"Médio"},
{id:30,d:"Serviço Social",a:"Código de Ética – deveres gerais",q:"Segundo o Código de Ética, é dever do assistente social no exercício da profissão:",o:["Policiar os comportamentos dos usuários para garantir a ordem institucional.","Abster-se de práticas que caracterizem censura, cerceamento da liberdade e policiamento dos comportamentos, denunciando sua ocorrência aos órgãos competentes.","Dispensar o registro no Conselho Regional quando atuar em instituição pública.","Evitar a participação em programas de socorro em calamidade pública."],c:1,n:["Errada: é o contrário do dever previsto.","Correta: art. 3º, c.","Errada: o número do registro deve ser utilizado (art. 3º, b).","Errada: participar de programas de socorro é dever (art. 3º, d)."],ref:"Código de Ética (1993), art. 3º",dica:"Art. 2º = direitos. Art. 3º = deveres gerais. Art. 5º = deveres com usuários.",lv:"Difícil"},
{id:31,d:"Serviço Social",a:"ECA – medidas de proteção",q:"Segundo o ECA, as medidas de proteção são aplicáveis sempre que os direitos reconhecidos na lei forem ameaçados ou violados. NÃO é uma dessas hipóteses:",o:["Por ação ou omissão da sociedade ou do Estado.","Por falta, omissão ou abuso dos pais ou responsável.","Em razão de sua conduta.","Por decisão exclusiva do Conselho Tutelar."],c:3,n:["É hipótese (art. 98, I).","É hipótese (art. 98, II).","É hipótese (art. 98, III).","Correta: não é hipótese prevista no art. 98."],ref:"Lei 8.069/1990, art. 98",dica:"Três hipóteses: sociedade/Estado, pais/responsável e a própria conduta.",lv:"Médio"},
{id:32,d:"Serviço Social",a:"ECA – Conselho Tutelar",q:"Segundo o ECA, o Conselho Tutelar é composto de cinco membros, escolhidos pela população local, para mandato de:",o:["2 anos.","3 anos.","4 anos.","5 anos."],c:2,n:["Errada.","Errada.","Correta: art. 132, mandato de 4 anos, permitida recondução por novos processos de escolha.","Errada: cinco é o número de membros, não de anos."],ref:"Lei 8.069/1990, art. 132",dica:"5 membros, 4 anos.",lv:"Fácil"},
{id:33,d:"Serviço Social",a:"ECA – família substituta",q:"Segundo o ECA, a colocação em família substituta far-se-á mediante:",o:["Guarda, tutela ou adoção.","Curatela, tutela ou interdição.","Apenas adoção.","Acolhimento institucional ou acolhimento familiar."],c:0,n:["Correta: art. 28.","Errada: curatela e interdição não são formas de família substituta.","Errada: a adoção é só uma das formas.","Errada: acolhimento é medida de proteção, de caráter provisório."],ref:"Lei 8.069/1990, art. 28",dica:"Família substituta: guarda, tutela e adoção.",lv:"Médio"},
{id:34,d:"Serviço Social",a:"ECA – adoção",q:"Segundo o ECA, entre adotante e adotando deve haver diferença mínima de idade de:",o:["10 anos.","14 anos.","16 anos.","18 anos."],c:2,n:["Errada.","Errada.","Correta: art. 42, §3º. O adotante deve ter, no mínimo, 18 anos.","Errada: 18 anos é a idade mínima do adotante."],ref:"Lei 8.069/1990, art. 42",dica:"Adotante: 18 anos. Diferença para o adotando: 16 anos.",lv:"Fácil"},
{id:35,d:"Serviço Social",a:"SUAS – CRAS",q:"No âmbito do SUAS, o CRAS é a unidade pública estatal que oferta serviços da:",o:["Proteção social básica.","Proteção social especial de média complexidade.","Proteção social especial de alta complexidade.","Previdência social."],c:0,n:["Correta: LOAS, art. 6º-C.","Errada: é o papel do CREAS.","Errada: ocorre, por exemplo, em serviços de acolhimento.","Errada: previdência não integra o SUAS."],ref:"Lei 8.742/1993, art. 6º-C",dica:"CRAS = básica. CREAS = especial.",lv:"Fácil"},
{id:36,d:"Serviço Social",a:"LOAS – BPC",q:"Segundo a LOAS, o Benefício de Prestação Continuada garante um salário mínimo à pessoa com deficiência e ao idoso com idade igual ou superior a:",o:["60 anos.","62 anos.","65 anos.","70 anos."],c:2,n:["Errada: 60 anos é a idade do Estatuto da Pessoa Idosa, não do BPC.","Errada.","Correta: art. 20, desde que comprovem não possuir meios de prover a própria manutenção nem de tê-la provida pela família.","Errada."],ref:"Lei 8.742/1993, art. 20",dica:"Estatuto: 60. BPC: 65.",lv:"Médio"},
{id:37,d:"Serviço Social",a:"Estatuto da Pessoa Idosa",q:"O Estatuto da Pessoa Idosa regula os direitos assegurados às pessoas com idade igual ou superior a:",o:["55 anos.","60 anos.","65 anos.","70 anos."],c:1,n:["Errada.","Correta: Lei 10.741/2003, art. 1º.","Errada: é a idade do BPC.","Errada."],ref:"Lei 10.741/2003, art. 1º",dica:"A Lei 8.842/1994 (Política Nacional do Idoso) fala em “maior de sessenta anos”. Leia as duas.",lv:"Fácil"},
{id:38,d:"Serviço Social",a:"Pessoa com Deficiência",q:"Segundo a Lei Brasileira de Inclusão (Lei nº 13.146/2015), a avaliação da deficiência, quando necessária, será biopsicossocial e realizada por:",o:["Médico perito, exclusivamente.","Equipe multiprofissional e interdisciplinar.","Apenas o assistente social.","O Conselho Tutelar."],c:1,n:["Errada: a avaliação não é só médica.","Correta: art. 2º, §1º.","Errada: é feita por equipe.","Errada: não é atribuição do Conselho Tutelar."],ref:"Lei 13.146/2015, art. 2º, §1º",dica:"Deficiência = modelo biopsicossocial, com equipe interdisciplinar.",lv:"Médio"},
{id:39,d:"Legislação (SUS)",a:"Saúde do Trabalhador",q:"A Política Nacional de Saúde do Trabalhador e da Trabalhadora foi instituída pela:",o:["Portaria GM/MS nº 1.823/2012.","Portaria GM/MS nº 2.436/2017.","Lei nº 8.142/1990.","Decreto nº 7.508/2011."],c:0,n:["Correta.","Errada: é a Política Nacional de Atenção Básica.","Errada: trata de participação e transferências.","Errada: trata da organização do SUS e da articulação interfederativa."],ref:"Portaria GM/MS nº 1.823/2012",dica:"Confira o texto da política no site do Ministério da Saúde.",lv:"Difícil"},
{id:40,d:"Raciocínio Lógico e Matemático",a:"Regra de três",q:"Se 5 trabalhadores montam 20 cadeiras em um dia, quantas cadeiras 8 trabalhadores, no mesmo ritmo, montam em um dia?",o:["28","30","32","36"],c:2,n:["Errada.","Errada.","Correta: 20 ÷ 5 = 4 por trabalhador; 4 × 8 = 32.","Errada."],ref:"Regra de três simples",dica:"Ache o valor por unidade primeiro.",lv:"Fácil"},
{id:41,d:"Raciocínio Lógico e Matemático",a:"Juros simples",q:"Um capital de R$ 2.000,00 é aplicado a juros simples de 3% ao mês durante 5 meses. Os juros obtidos são de:",o:["R$ 250,00","R$ 300,00","R$ 310,00","R$ 350,00"],c:1,n:["Errada.","Correta: 2.000 × 0,03 × 5 = 300.","Errada: juros compostos dariam cerca de R$ 318,55, mas a questão pede juros simples.","Errada."],ref:"Juros simples: J = C · i · t",dica:"Juros simples incidem sempre sobre o capital inicial.",lv:"Fácil"},
{id:42,d:"Raciocínio Lógico e Matemático",a:"Probabilidade",q:"Uma urna tem 3 bolas azuis e 2 vermelhas. Retirando-se uma bola ao acaso, a probabilidade de ela ser vermelha é de:",o:["20%","30%","40%","60%"],c:2,n:["Errada.","Errada.","Correta: 2 ÷ 5 = 0,4.","Errada: é a probabilidade de ser azul."],ref:"Probabilidade: casos favoráveis ÷ casos possíveis",dica:"Casos favoráveis sobre casos possíveis.",lv:"Fácil"},
{id:43,d:"Raciocínio Lógico e Matemático",a:"Equivalência lógica",q:"Uma proposição equivalente a “Se estudo, então passo” é:",o:["Se passo, então estudo.","Se não passo, então não estudo.","Se não estudo, então não passo.","Estudo e não passo."],c:1,n:["Errada: é a recíproca.","Correta: é a contrapositiva.","Errada: é a inversa.","Errada: é a negação da condicional."],ref:"Lógica proposicional: p→q ≡ ~q→~p",dica:"Condicional equivale à contrapositiva, não à recíproca nem à inversa.",lv:"Médio"},
{id:44,d:"Raciocínio Lógico e Matemático",a:"Análise combinatória",q:"De quantas maneiras 4 candidatos podem formar uma fila?",o:["12","16","24","48"],c:2,n:["Errada.","Errada.","Correta: 4! = 4 × 3 × 2 × 1 = 24.","Errada."],ref:"Permutação simples",dica:"n elementos distintos em fila: n!",lv:"Fácil"},
{id:45,d:"Língua Portuguesa",a:"Crase",q:"Assinale a frase em que o uso do sinal indicativo de crase está correto.",o:["Comecei a estudar à partir de segunda.","Entreguei os documentos à diretora.","Ficou frente à frente com o fiscal.","Foi à pé até o local."],c:1,n:["Errada: não há crase antes de verbo.","Correta: a (preposição) + a (artigo) diante de palavra feminina.","Errada: o correto é “frente a frente”.","Errada: não há crase antes de palavra masculina."],ref:"Gramática normativa: crase",dica:"Troque por “ao”: se couber, há crase.",lv:"Médio"},
{id:46,d:"Língua Portuguesa",a:"Regência verbal",q:"Assinale a frase com regência verbal de acordo com a norma-padrão.",o:["Prefiro estudar do que dormir.","Aspiro ao cargo de assistente social.","Chegamos na prova cedo.","Obedeço as regras do edital."],c:1,n:["Errada: “prefiro estudar a dormir”.","Correta: aspirar (desejar) exige a preposição “a”.","Errada: chegar pede “a”: “chegamos à prova”.","Errada: obedecer pede “a”: “obedeço às regras”."],ref:"Gramática normativa: regência verbal",dica:"Aspirar a, obedecer a, preferir A a B.",lv:"Médio"},
{id:47,d:"Língua Portuguesa",a:"Acentuação gráfica",q:"Assinale a palavra acentuada corretamente, segundo o Acordo Ortográfico em vigor.",o:["idéia","saúde","heróico","vôo"],c:1,n:["Errada: ditongo aberto em paroxítona perdeu o acento.","Correta: hiato com “u” tônico.","Errada: “heroico” perdeu o acento.","Errada: “voo” não tem acento."],ref:"Acordo Ortográfico da Língua Portuguesa",dica:"Perderam acento: ideia, heroico, voo, paranoico.",lv:"Fácil"},
{id:48,d:"História e Geografia do TO",a:"Palmas",q:"A capital do Tocantins, Palmas, foi fundada em:",o:["1988","1989","1990","1991"],c:1,n:["Errada: o Estado foi criado em 1988.","Correta: fundada em 20 de maio de 1989.","Errada.","Errada."],ref:"Governo do Estado do Tocantins",dica:"Estado criado em 1988, instalado e capital fundada em 1989.",lv:"Fácil"},
{id:49,d:"História e Geografia do TO",a:"Vegetação",q:"O bioma predominante no Estado do Tocantins é:",o:["Caatinga.","Cerrado.","Pantanal.","Mata Atlântica."],c:1,n:["Errada.","Correta. Há também área de transição com a Amazônia.","Errada.","Errada."],ref:"IBGE, Biomas do Brasil",dica:"Cerrado, com transição para a Amazônia.",lv:"Fácil"},
{id:50,d:"História e Geografia do TO",a:"Hidrografia",q:"A Ilha do Bananal, considerada a maior ilha fluvial do mundo, localiza-se no rio:",o:["Araguaia.","Paranã.","Sono.","Formoso."],c:0,n:["Correta: a ilha é formada pela divisão do rio Araguaia.","Errada.","Errada.","Errada."],ref:"IBGE; Governo do Estado do Tocantins",dica:"Principais rios: Tocantins e Araguaia.",lv:"Médio"},
{id:51,d:"Legislação (SUS)",a:"Lei 8.142 – conselhos e conferências",real:"Pref. São José do Rio Preto/SP · Vunesp · 2025",q:"De acordo com a Lei Federal nº 8.142/1990, qual é a principal diferença entre os conselhos de saúde e as conferências de saúde no Sistema Único de Saúde (SUS)?",o:["Os conselhos tratam de políticas locais, e as conferências discutem a implementação de programas federais.","Os conselhos reúnem gestores e usuários, e as conferências reúnem apenas representantes da esfera da gestão.","Os conselhos levantam as necessidades de saúde da população, e as conferências analisam o orçamento público.","Os conselhos atuam de forma permanente e deliberativa, enquanto as conferências são periódicas, avaliam a situação de saúde e propõem diretrizes.","Os conselhos e as conferências têm a mesma função de controle social, diferindo-se apenas pela sua periodicidade."],c:3,n:["Errada: ambos atuam em todas as esferas, e a conferência propõe diretrizes, não só discute programas federais.","Errada: a conferência reúne representantes de vários segmentos sociais, não só da gestão.","Errada: inverte as funções. A conferência avalia a situação de saúde e propõe diretrizes.","Correta: art. 1º, §§1º e 2º. Conferência a cada 4 anos. Conselho permanente e deliberativo.","Errada: as funções são diferentes, não só a periodicidade."],ref:"Lei 8.142/1990, art. 1º, §§1º e 2º",dica:"Conferência = periódica (4 anos), avalia e propõe diretrizes. Conselho = permanente e deliberativo.",lv:"Médio"},
{id:52,d:"Legislação (SUS)",a:"Lei 8.080 – conceito e organização",real:"SESAP/RN · IDECAN · 2025",q:"A Lei nº 8.080/1990, conhecida como Lei Orgânica da Saúde, regulamenta o Sistema Único de Saúde (SUS) e define aspectos fundamentais para a organização e o funcionamento da saúde pública no Brasil. Sobre o tema, marque o item correto.",o:["A Lei nº 8.080/1990 define a saúde como um direito fundamental do ser humano, cabendo ao Estado prover as condições indispensáveis ao seu pleno exercício.","A Lei nº 8.080/1990 estabelece que a saúde deve ser financiada exclusivamente pelos governos estaduais, sem a participação do governo federal.","A lei dispõe que a iniciativa privada não pode participar de forma complementar no Sistema Único de Saúde (SUS).","Essa lei limita a atuação do SUS exclusivamente à assistência curativa, excluindo ações de promoção e prevenção à saúde.","De acordo com a Lei nº 8.080/1990, o SUS está restrito ao atendimento de moradores das capitais dos estados brasileiros."],c:0,n:["Correta: art. 2º, caput.","Errada: o financiamento é tripartite, com participação da União.","Errada: a iniciativa privada participa de forma complementar (art. 4º, §2º).","Errada: o SUS inclui promoção, proteção e recuperação da saúde.","Errada: o SUS é universal, sem restrição territorial desse tipo."],ref:"Lei 8.080/1990, art. 2º, caput",dica:"Art. 2º: saúde é direito fundamental, e o Estado deve prover as condições.",lv:"Fácil"},
{id:53,d:"Legislação (SUS)",a:"Lei 8.142 – Conselho de Saúde",real:"SESAP/RN · IDECAN · 2025",q:"Segundo a Lei nº 8.142/90, o Conselho de Saúde, em caráter permanente e deliberativo, órgão colegiado composto por representantes do governo, prestadores de serviço, profissionais de saúde e usuários atua",o:["como órgão executor e auditor das políticas de saúde em cada instância, tem inclusive o poder de determinar medidas diferenciadas e diferentes das adotadas pelo Ministério da Saúde.","no gerenciamento do Sistema Único de Saúde, em suas instâncias de origem, ditando e promovendo toda a política de saúde pertinente.","exclusivamente na execução da política de saúde na instância correspondente, exceto nos aspectos econômicos e financeiros, cujas decisões são de responsabilidade do chefe do poder legalmente constituído em cada esfera do governo.","exclusivamente na formulação de estratégias de saúde a serem aplicadas em cada instância, não tendo caráter consultivo ou executivo em relação aos aspectos econômicos e financeiros, cujas decisões são de responsabilidade total dos chefes dos executivos em cada instância.","na formulação de estratégias e no controle da execução da política de saúde na instância correspondente, inclusive nos aspectos econômicos e financeiros, cujas decisões serão homologadas pelo chefe do poder legalmente constituído em cada esfera do governo."],c:4,n:["Errada: o Conselho não é órgão executor, e sim de formulação e controle.","Errada: o gerenciamento cabe ao gestor de cada esfera.","Errada: o Conselho atua também nos aspectos econômicos e financeiros e não só na execução.","Errada: o Conselho também controla a execução, inclusive nos aspectos econômicos e financeiros.","Correta: art. 1º, §2º. Decisões homologadas pelo chefe do poder legalmente constituído."],ref:"Lei 8.142/1990, art. 1º, §2º",dica:"Conselho: formula estratégias e controla a execução, inclusive a parte financeira.",lv:"Difícil"},
{id:54,d:"Legislação (SUS)",a:"Lei 8.080 – assistência terapêutica (art. 6º)",real:"Pref. Flores/PE · IGEDUC · 2025",q:"No âmbito do Sistema Único de Saúde (SUS), é recorrente o debate acerca da abrangência legal da assistência terapêutica integral, especialmente diante de alegações de que a legislação não incluiria a dimensão farmacêutica, ou seja, o fornecimento de medicamentos e insumos necessários ao tratamento do paciente. À luz do que dispõe o Artigo 6º, inciso I, alínea ‘d’, da Lei nº 8.080/1990, que define as ações e serviços compreendidos no campo de atuação do SUS, assinale a alternativa CORRETA:",o:["A assistência terapêutica é integral, inclusive farmacêutica, compondo o campo de atuação do SUS.","A dimensão farmacêutica é exclusiva do setor privado.","A Lei silencia sobre medicamentos no âmbito do SUS.","A terapêutica é restrita a procedimentos médicos, excluídos medicamentos."],c:0,n:["Correta: art. 6º, I, d.","Errada: a assistência farmacêutica integra o SUS.","Errada: a lei trata expressamente do tema.","Errada: a lei inclui a assistência farmacêutica."],ref:"Lei 8.080/1990, art. 6º, I, d",dica:"Art. 6º, I: vigilância sanitária (a), epidemiológica (b), saúde do trabalhador (c) e assistência terapêutica integral (d).",lv:"Médio"},
{id:55,d:"Legislação (SUS)",a:"Lei 8.080 – princípios",real:"Pref. João Alfredo/PE · ADM&TEC · 2025",q:"A Lei nº 8.080/1990 organiza as ações de saúde em todo o território nacional, contemplando princípios fundamentais do SUS. Assinale a alternativa CORRETA:",o:["O acesso aos serviços de saúde depende de vínculo empregatício, priorizando indivíduos com carteira assinada.","A universalização do atendimento, a integralidade das ações e a participação da comunidade configuram pilares importantes previstos pela lei.","A legislação direciona a assistência a grupos de alta renda, com base em recursos provenientes dos municípios.","O texto legal exclui a vigilância epidemiológica das responsabilidades do SUS, concentrando o foco na medicina curativa."],c:1,n:["Errada: o acesso é universal, sem exigir vínculo empregatício.","Correta: art. 7º (universalidade, integralidade e participação da comunidade).","Errada: a assistência é universal, e o financiamento é tripartite.","Errada: a vigilância epidemiológica integra o campo de atuação do SUS (art. 6º, I, b)."],ref:"Lei 8.080/1990, art. 7º, I, II e VIII",dica:"Quando a alternativa fala em restrição por renda ou emprego, desconfie.",lv:"Fácil"},
{id:56,d:"Legislação (SUS)",a:"Lei 8.080 – princípios doutrinários",real:"Pref. Ipumirim/SC · AMAUC · 2025",q:"A Lei Orgânica da Saúde (Lei nº 8.080/1990) dispõe sobre as condições para a promoção, proteção e recuperação da saúde e regula as ações e serviços de saúde em todo o território nacional. A lei estabelece princípios doutrinários e organizativos que regem o Sistema Único de Saúde (SUS). I. O princípio da Universalidade determina que a saúde é um direito de todos e dever do Estado, garantindo acesso aos serviços de saúde em todos os níveis de assistência, sem preconceitos ou privilégios. II. O princípio da Integralidade entende o indivíduo como um todo, assegurando ações contínuas de promoção, proteção e recuperação, integrando ações preventivas e curativas. III. A Descentralização é um princípio organizativo que prevê a redistribuição das responsabilidades quanto às ações e serviços de saúde entre os vários níveis de governo, com direção única em cada esfera de governo. IV. A Equidade, embora não explicitada com este termo exato no texto original da lei 8080/90 (mas sim como igualdade da assistência), é interpretada doutrinariamente como o tratamento desigual aos desiguais, priorizando quem tem maior necessidade para reduzir disparidades. Assinale a alternativa que apresenta somente as proposições CORRETAS:",o:["II e IV.","I, II e III.","III e IV.","I e III.","I, II, III e IV."],c:4,n:["Errada: I e III também estão corretas.","Errada: falta a IV, que o enunciado descreve corretamente.","Errada: I e II também estão corretas.","Errada: II e IV também estão corretas.","Correta: I (art. 7º, I), II (art. 7º, II), III (art. 7º, IX) e IV (a lei fala em igualdade da assistência, art. 7º, IV)."],ref:"Lei 8.080/1990, art. 7º, I, II, IV e IX",dica:"Em questões com assertivas, confirme cada uma antes de olhar as alternativas.",lv:"Médio"},
{id:57,d:"Legislação (SUS)",a:"Decreto 7.508 – COAP (art. 36)",real:"Pref. Turvo/SC · PS Concursos · 2025",q:"De acordo com o artigo 36 da lei Federal 7508/2011, o Contrato Organizativo da Ação Pública de Saúde conterá as seguintes disposições essenciais, EXCETO:",o:["Identificação das necessidades de saúde locais e regionais;","Estratégias para a melhoria das ações e serviços de saúde;","Indicadores e metas de saúde;","Investimentos na rede de serviços exclusiva dos municípios;","Oferta de ações e serviços de vigilância em saúde, promoção, proteção e recuperação da saúde em âmbito regional e inter-regional."],c:3,n:["Faz parte do art. 36 (necessidades de saúde locais e regionais).","Faz parte do art. 36 (estratégias para melhoria das ações e serviços).","Faz parte do art. 36 (indicadores e metas de saúde).","Correta (é a exceção): o art. 36 prevê investimentos na rede de serviços e as respectivas responsabilidades, sem restringi-los aos municípios.","Faz parte do art. 36 (oferta de ações e serviços em âmbito regional e inter-regional)."],ref:"Decreto 7.508/2011, art. 36 (o enunciado o chama de lei, mas é decreto)",dica:"Cuidado com palavras como “exclusiva” e “somente”: costumam marcar a alternativa errada.",lv:"Difícil"},
{id:58,d:"Legislação (SUS)",a:"Lei 8.080 – acompanhante da mulher",real:"Pref. Jundiaí/SP · VUNESP · 2025",q:"Assinale a alternativa correta sobre o direito a acompanhante da mulher nos serviços de saúde, segundo a Lei no 8.080/90.",o:["O direito a acompanhante da mulher deve ser garantido nos serviços de saúde públicos e privados, excluídos os centros cirúrgicos e as unidades de terapia intensiva.","O acompanhante de livre indicação da paciente ou de seu representante legal em situações previstas na lei estará obrigado a preservar o sigilo das informações de saúde a que tiver acesso pela sua condição de acompanhante.","Em nenhuma hipótese a paciente pode renunciar ao direito de ter acompanhante em consultas, exames e procedimentos.","Nos casos em que a mulher tiver acompanhante indicado pela unidade de saúde responsável pelo atendimento, a falta de condições de arcar com o custo adicional não privará a paciente desse direito.","O acompanhante em consultas, exames e procedimentos em unidades de saúde públicas deve ser maior de idade e ter grau de parentesco de até segundo grau."],c:1,n:["Errada segundo o gabarito: confira no texto vigente se há as exclusões citadas.","Correta (gabarito da banca): o acompanhante deve preservar o sigilo das informações de saúde.","Errada: a paciente pode renunciar ao direito.","Errada segundo o gabarito. Leia a regra sobre acompanhante indicado pela unidade no texto vigente.","Errada: a indicação do acompanhante é livre, sem exigência de grau de parentesco."],ref:"Lei 8.080/1990, art. 19-J (redação da Lei 14.737/2023). Confira o texto vigente no Planalto.",dica:"Tema recente: leia o artigo inteiro, pois as bancas cobram os detalhes.",lv:"Difícil"},
{id:59,d:"Legislação (SUS)",a:"Lei 8.080 – objetivos e determinantes",real:"Pref. Flores/PE · IGEDUC · 2025",q:"O conceito legal de saúde na Lei nº 8.080/1990 ultrapassa a noção estrita de doença e incorpora determinantes e condicionantes que fundamentam a ação estatal contínua. À luz dos Artigos 3º e 5º, I, assinale a alternativa CORRETA quanto aos objetivos do SUS.",o:["Restringir-se a doenças transmissíveis e urgências.","Atuar apenas em assistência curativa individual, sem ações de promoção.","Identificar e divulgar os fatores determinantes e condicionantes da saúde, além da assistência quando necessária.","Limitar a intervenção a serviços hospitalares de alta complexidade."],c:2,n:["Errada: o SUS não se restringe a esses casos.","Errada: o SUS inclui promoção e prevenção.","Correta: art. 5º, I (identificação e divulgação dos fatores determinantes e condicionantes) e art. 3º.","Errada: o SUS atua em todos os níveis de complexidade."],ref:"Lei 8.080/1990, arts. 3º e 5º, I",dica:"Objetivos: fatores condicionantes, formulação de política e assistência integrada.",lv:"Médio"},
{id:60,d:"Legislação (SUS)",a:"Decreto 7.508 – RENAME",real:"Pref. Bonito de Santa Fé/PB · FAPTO · 2025",q:"O Decreto n.º 7.508, de 28 de junho de 2011, regulamenta a Lei n.º 8.080, de 19 de setembro de 1990, para dispor sobre a organização do Sistema Único de Saúde (SUS). No âmbito da assistência à saúde, estabelece a Relação Nacional de Medicamentos Essenciais (RENAME), que deverá ser acompanhada pelo",o:["índice terapêutico químico.","guia prático de medicamentos.","formulário terapêutico nacional.","instrumento descritivo do medicamento."],c:2,n:["Errada: não é o instrumento previsto.","Errada: não é o instrumento previsto.","Correta: a RENAME é acompanhada do Formulário Terapêutico Nacional (FTN), que subsidia a prescrição, a dispensação e o uso dos medicamentos.","Errada: não é o instrumento previsto."],ref:"Decreto 7.508/2011, art. 26, parágrafo único",dica:"RENAME + FTN (Formulário Terapêutico Nacional).",lv:"Médio"},
{id:61,d:"Legislação (SUS)",a:"Lei 8.142 – assertivas sobre participação",real:"Pref. Flores/PE · IGEDUC · 2025",q:"A Lei nº 8.142/1990 disciplina a participação da comunidade na gestão do Sistema Único de Saúde (SUS), consolidando o caráter democrático e descentralizado da política pública de saúde. Essa participação se materializa, principalmente, por meio das Conferências e Conselhos de Saúde, órgãos que possibilitam o controle social e a corresponsabilidade entre Estado e sociedade civil. Com base nas disposições da referida lei, examine as assertivas a seguir: I. O Conselho de Saúde é permanente e deliberativo, com atribuição de formular estratégias e controlar a execução da política de saúde, inclusive nos aspectos econômico-financeiros. II. A paridade dos usuários em relação ao conjunto dos demais segmentos é opcional. III. As Conferências de Saúde terão regimento próprio aprovado pelo respectivo conselho. IV. Os relatórios de gestão integram os requisitos para repasse, permitindo o controle previsto. Assinale a alternativa CORRETA:",o:["Estão corretas apenas I e III.","Estão corretas apenas I e II.","Estão corretas apenas I, III e IV.","Estão corretas apenas II e IV."],c:2,n:["Errada: a IV também está correta.","Errada: a II é falsa, pois a paridade é obrigatória.","Correta: I (art. 1º, §2º), III (art. 1º, §5º) e IV (art. 4º).","Errada: a II é falsa."],ref:"Lei 8.142/1990, art. 1º, §§2º, 4º e 5º, e art. 4º",dica:"A representação dos usuários é paritária em relação ao conjunto dos demais segmentos.",lv:"Médio"},
{id:62,d:"Legislação (SUS)",a:"Lei 8.080 – iniciativa privada",real:"SES/PE · IAUPE · 2025",q:"Em outubro de 2024, seis pessoas foram infectadas pelo vírus HIV após receberem transplantes de órgãos no Rio de Janeiro. O laboratório responsável pelas análises dos órgãos é privado e foi contratado pela Fundação Saúde, sob a responsabilidade da Secretaria Estadual de Saúde, para atendimento ao programa de transplantes no estado. Sobre a participação da iniciativa privada no Sistema Único de Saúde (SUS), assinale a alternativa INCORRETA.",o:["A constituição federal de 1988 permite a participação das instituições privadas de forma complementar ao Sistema Único de Saúde.","Os critérios e valores para a remuneração de serviços e os parâmetros de cobertura assistencial serão estabelecidos pelos estabelecimentos contratados.","As entidades filantrópicas e as sem fins lucrativos terão preferência para participar do SUS.","A participação complementar dos serviços privados será formalizada mediante contrato ou convênio, observadas, a respeito, as normas de direito público.","Aos proprietários, administradores e dirigentes de entidades ou serviços contratados é vedado exercer cargo de chefia ou função de confiança no SUS."],c:1,n:["Correta como afirmativa: CF, art. 199, §1º.","Incorreta (é a resposta): os critérios e valores de remuneração são estabelecidos pela direção nacional do SUS e aprovados pelo Conselho Nacional de Saúde (Lei 8.080, art. 26).","Correta como afirmativa: preferência prevista na CF, art. 199, §1º.","Correta como afirmativa: Lei 8.080, art. 24, parágrafo único.","Correta como afirmativa: Lei 8.080, art. 26, §4º."],ref:"CF/1988, art. 199, §1º; Lei 8.080/1990, arts. 24 e 26",dica:"Em questões INCORRETA, marque a única que a lei não diz.",lv:"Difícil"},
{id:63,d:"Legislação (SUS)",a:"Lei 8.080 – planejamento e orçamento",real:"Pref. Flores/PE · IGEDUC · 2025",q:"O processo de planejamento e orçamento em saúde, segundo a Lei nº 8.080/1990, deve garantir coerência interfederativa e compatibilização de planos. À luz dos Artigos 30 e 31, assinale a CORRETA:",o:["O planejamento é exclusivo da União.","O planejamento e o orçamento são ascendentes, do nível local ao federal, com compatibilização entre as esferas.","O processo prescinde de integração interfederativa.","O orçamento não se submete às normas do SUS."],c:1,n:["Errada: o planejamento envolve todas as esferas.","Correta: planejamento e orçamento do SUS são ascendentes, do nível local até o federal.","Errada: a integração entre esferas é essencial.","Errada: o orçamento segue as normas do SUS."],ref:"Lei 8.080/1990, art. 36 (o enunciado cita os arts. 30 e 31: confira o texto)",dica:"Planejamento ascendente: do local para o federal.",lv:"Médio"},
{id:64,d:"Legislação (SUS)",a:"Decreto 7.508 – COAP",real:"FDT Residência · FUNDATEC · 2025",q:"Considerando os mecanismos para a ordenação da Rede de Atenção à Saúde no SUS instituídos pelo Decreto nº 7.508/2011, assinale a alternativa correta em relação aos Contratos Organizativos da Ação Pública da Saúde (COAPs).",o:["Sua celebração é facultativa e não interfere na pactuação das responsabilidades dos entes federados.","Definem as responsabilidades sanitárias, metas, indicadores e formas de monitoramento e avaliação entre os entes da federação.","Substituem os instrumentos de planejamento como o Plano de Saúde e a Programação Anual de Saúde.","Definem somente as responsabilidades sanitárias e formas de monitoramento e avaliação entre os entes dos Estados."],c:1,n:["Errada: o COAP pactua responsabilidades entre os entes.","Correta: art. 36 (responsabilidades, indicadores e metas, avaliação e monitoramento).","Errada: não substitui os instrumentos de planejamento.","Errada: envolve os entes da Região de Saúde, e o conteúdo é mais amplo."],ref:"Decreto 7.508/2011, art. 36",dica:"COAP: acordo entre entes federativos, com responsabilidades, metas e indicadores.",lv:"Médio"},
{id:65,d:"Legislação (SUS)",a:"Lei 8.142 – requisitos para repasse",real:"Pref. Flores/PE · IGEDUC · 2025",q:"Para receber recursos do Fundo Nacional de Saúde, a Lei 8.142/1990 exige requisitos cumulativos. Conforme o artigo 4º, é CORRETO afirmar que o ente deve contar com:",o:["Convênio específico com o Ministério da Saúde.","Apenas Conselho de Saúde, sem fundo.","Autorização anual da Assembleia Legislativa.","Fundo de Saúde; Conselho de Saúde (com composição paritária); e Plano de Saúde."],c:3,n:["Errada: convênio não é requisito do art. 4º.","Errada: o Fundo de Saúde também é exigido.","Errada: não há essa exigência.","Correta: art. 4º (também exige relatórios de gestão, contrapartida de recursos e comissão do plano de carreira)."],ref:"Lei 8.142/1990, art. 4º",dica:"Requisitos: Fundo, Conselho (paritário), plano, relatórios de gestão, contrapartida e comissão do PCCS.",lv:"Médio"},
{id:66,d:"Legislação (SUS)",a:"Lei 8.080 – serviços privados",real:"Pref. Serra Alta/SC · Instituto EVO · 2025",q:"De acordo com a lei 8080 de 1990, assinale a alternativa abaixo que completa, respectivamente, as lacunas em: “Os serviços privados de assistência à saúde caracterizam-se pela atuação, por ______________, de profissionais liberais, legalmente ______________, e de pessoas jurídicas de direito privado na promoção, proteção e recuperação da saúde”.",o:["terceirização, contratados;","iniciativa própria, habilitados;","iniciativa própria, contratados;","terceirização, habilitados."],c:1,n:["Errada: não há terceirização nem contratação no texto.","Correta: art. 21 da Lei 8.080.","Errada: o texto diz “habilitados”.","Errada: o texto diz “iniciativa própria”."],ref:"Lei 8.080/1990, art. 21",dica:"Questão de lacuna: decore a redação literal dos artigos curtos.",lv:"Médio"},
{id:67,d:"Legislação (SUS)",a:"Lei 8.142 – Fundo Nacional de Saúde",real:"Pref. Flores/PE · IGEDUC · 2025",q:"Uma secretaria estadual questiona a forma de alocação de despesas no Fundo Nacional de Saúde e o repasse regular e automático de recursos aos entes subnacionais. Segundo os Artigos 2º e 3º da Lei nº 8.142/1990, é CORRETO afirmar que:",o:["O FNS não cobre ações estaduais/municipais.","O repasse depende apenas de emenda parlamentar.","Os recursos do FNS contemplam despesas do MS e cobertura das ações e serviços implementados por Estados, DF e Municípios (art. 2º), e o repasse ocorre de forma regular e automática.","O repasse é eventual e discricionário, sem critério legal."],c:2,n:["Errada: o FNS cobre ações de Estados, DF e Municípios (art. 2º, IV).","Errada: não depende só de emenda.","Correta: arts. 2º e 3º.","Errada: o repasse é regular e automático, com critérios legais."],ref:"Lei 8.142/1990, arts. 2º e 3º",dica:"Repasse regular e automático, com critérios previstos em lei.",lv:"Médio"},
{id:68,d:"Legislação (SUS)",a:"Lei 8.080 – direito à saúde (art. 2º)",real:"Pref. Japaraíba/MG · FUMARC · 2025",q:"A saúde é um direito fundamental do ser humano, devendo o Estado prover as condições indispensáveis ao seu pleno exercício (Art. 2º - Lei 8080/90). A afirmativa extraída da lei orgânica do SUS, pode ser entendida, EXCETO:",o:["É dever do Estado de garantir a saúde da população.","É dever dos empregadores garantir a saúde dos seus funcionários, com utilização da saúde suplementar.","O dever do Estado consiste na formulação e execução de políticas econômicas e sociais que visem à redução de riscos de doenças e de outros agravos.","O dever do Estado consiste na formulação e execução de políticas econômicas e sociais no estabelecimento de condições que assegurem acesso universal e igualitário às ações e aos serviços para a promoção, proteção e recuperação da saúde."],c:1,n:["Faz parte do art. 2º, caput.","Correta (é a exceção): o §2º diz que o dever do Estado não exclui o das empresas, mas a lei não atribui ao empregador o dever de garantir saúde por meio da saúde suplementar.","Faz parte do art. 2º, §1º.","Faz parte do art. 2º, §1º."],ref:"Lei 8.080/1990, art. 2º, §§1º e 2º",dica:"Art. 2º: caput (direito e dever), §1º (políticas) e §2º (dever do Estado não exclui o de pessoas, família, empresas e sociedade).",lv:"Médio"},
{id:69,d:"Legislação (SUS)",a:"Lei 8.080 – campo de atuação do SUS",real:"Pref. Japaraíba/MG · FUMARC · 2025",q:"Está incluída no campo de atuação do Sistema Único de Saúde (SUS) a execução de ações de:",o:["desenvolvimento científico e tecnológico.","saúde bucal.","vigilância de saúde mental.","vigilância de situação social."],c:1,n:["Errada segundo o gabarito. Atenção: o art. 6º também fala em incremento do desenvolvimento científico e tecnológico, mas a questão pede ações de execução.","Correta segundo o gabarito: a saúde bucal foi incluída no campo de atuação do SUS (art. 6º, com redação da Lei 14.572/2023). Confira o inciso no texto vigente.","Errada: não há “vigilância de saúde mental” no art. 6º.","Errada: não há “vigilância de situação social” no art. 6º."],ref:"Lei 8.080/1990, art. 6º (confira a redação vigente no Planalto)",dica:"Art. 6º: leia a lista inteira (vigilância sanitária, epidemiológica, saúde do trabalhador, assistência terapêutica, nutricional, sangue, saúde bucal...).",lv:"Difícil"},
{id:70,d:"Legislação (SUS)",a:"Lei 8.080 – iniciativa privada",real:"SESAP/RN · IDECAN · 2025",q:"A Lei Orgânica da Saúde - Lei nº 8.080/1990 regula, em todo o território nacional, as ações e serviços de saúde. Com base nessa legislação, assinale a alternativa correta.",o:["As ações de promoção à saúde são de responsabilidade exclusiva das Unidades Básicas de Saúde (UBS).","As ações de vigilância epidemiológica são exclusivas do nível federal e não podem ser realizadas por estados ou municípios.","A participação da iniciativa privada no SUS é permitida, sendo complementar à atuação do sistema público de saúde.","A Lei nº 8.080/1990 estabelece que os serviços de saúde podem ser cobrados dos usuários em casos de alto custo para o SUS.","De acordo com a lei, o conceito de saúde restringe-se à ausência de doenças e agravos físicos."],c:2,n:["Errada: a promoção da saúde envolve todo o sistema e outros setores, não só as UBS.","Errada: a vigilância epidemiológica é executada também por estados e municípios.","Correta: art. 4º, §2º e arts. 24 a 26 (CF, art. 199, §1º).","Errada: o acesso é universal e igualitário, sem cobrança do usuário.","Errada: o conceito de saúde é ampliado, com determinantes e condicionantes (art. 3º)."],ref:"Lei 8.080/1990, art. 4º, §2º e arts. 24 a 26. O comentário do QConcursos cita o art. 20, mas a complementaridade está nos arts. 24 e seguintes.",dica:"Privado no SUS = complementar, por contrato ou convênio.",lv:"Médio"},
{id:71,d:"Legislação (SUS)",a:"Controle social – Conselho Nacional de Saúde",real:"Pref. Cuparaque/MG · MÁXIMA AUDITORIA · 2025",q:"Sobre Controle Social no Sistema Único de Saúde - SUS, assinale a alternativa CORRETA:",o:["O Conselho Nacional de Saúde não tem como atribuição aprovar o orçamento da saúde.","Os conselheiros nacionais de saúde são eleitos em processo eleitoral, realizado a cada quatro anos.","A distribuição das vagas no Conselho Nacional de Saúde é organizada da seguinte forma: 50% usuários do SUS, 25% gestores, prestadores de serviço de saúde e entidades empresariais da área de saúde e 25% trabalhadores do SUS.","Os conselhos de saúde são exemplos de mecanismo de controle social, entretanto não são responsáveis pela realização das conferências de saúde."],c:2,n:["Errada segundo o gabarito: o Conselho atua no controle da execução e nos aspectos econômicos e financeiros (Lei 8.142, art. 1º, §2º).","Errada: os conselheiros são indicados pelas entidades e segmentos representados, não eleitos em eleição geral.","Correta: a paridade é de 50% usuários, 25% trabalhadores e 25% gestores e prestadores (Resolução CNS nº 453/2012).","Errada: a Conferência é convocada pelo Poder Executivo ou, extraordinariamente, pelo Conselho (Lei 8.142, art. 1º, §1º)."],ref:"Resolução CNS nº 453/2012; Lei 8.142/1990, art. 1º. Confira o texto da resolução.",dica:"Memorize a proporção 50% usuários, 25% trabalhadores, 25% gestores e prestadores.",lv:"Difícil"},
{id:72,d:"Legislação (SUS)",a:"Organização do SUS – NOB/SUS/96",real:"Pref. Brusque/SC · FEPESE · 2025",q:"O avanço significativo no processo de descentralização e municipalização do Sistema Único de Saúde (SUS) que consolidou o exercício pleno da gestão da atenção à saúde pelos municípios e pelo Distrito Federal, redefinindo os papéis das esferas federal, estadual e municipal, com ênfase na direção única, na integralidade das ações e na priorização da atenção básica ocorreu com a:",o:["Lei no 10.216/2001.","Lei orgânica da saúde nº 8.080/1990.","Lei orgânica da saúde nº 8.142/1990.","Norma Operacional Básica – NOB/SUS/96.","Norma Operacional Básica – NOB/SUS/92."],c:3,n:["Errada: a Lei 10.216/2001 trata da reforma psiquiátrica.","Errada: a Lei 8.080 criou a base legal do SUS, mas a municipalização da gestão se consolidou por normas operacionais.","Errada: a Lei 8.142 trata de participação social e transferências.","Correta: a NOB-SUS 01/96 criou a Gestão Plena da Atenção Básica e a Gestão Plena do Sistema Municipal.","Errada: a NOB/SUS/92 é anterior e não consolidou a gestão plena municipal."],ref:"Ministério da Saúde, NOB-SUS 01/96",dica:"Municipalização da gestão = NOB/SUS/96. É tema de organização e gestão do SUS.",lv:"Difícil"},
{id:73,d:"Legislação (SUS)",a:"Lei 8.080 – participação complementar (convênios)",real:"Pref. Flores/PE · IGEDUC · 2025",q:"Em um Município com déficit temporário de oferta, firmaram-se convênios com entidade filantrópica para cobertura assistencial até a expansão da rede pública. De acordo com o Artigo 19, da Lei nº 8.080/1990, essa solução:",o:["É exclusiva para alta complexidade.","É participação primária, com delegação total de coordenação do SUS.","É participação complementar, mediante contrato ou convênio, com preferência às entidades filantrópicas e sem fins lucrativos.","Depende de licitação de obras públicas."],c:2,n:["Errada: não é exclusiva de alta complexidade.","Errada: a participação é complementar, não primária, e o SUS mantém a direção.","Correta: arts. 24 e 25 (preferência às filantrópicas e sem fins lucrativos).","Errada: a complementaridade se formaliza por contrato ou convênio, não por licitação de obras."],ref:"Lei 8.080/1990, arts. 24 e 25 (o enunciado cita o art. 19: confira o texto)",dica:"Complementar + contrato ou convênio + preferência às filantrópicas.",lv:"Médio"},
{id:74,d:"Legislação (SUS)",a:"Complementar – RDC 15/2012 (Anvisa)",comp:1,real:"Pref. São José dos Quatro Marcos/MT · SELECON · 2025",q:"Durante o processamento de artigos hospitalares, os profissionais de saúde responsáveis devem seguir as boas práticas para garantir a segurança do paciente e evitar infecções. De acordo com as etapas de processamento de artigos hospitalares norteada pela RDC nº 15 de 15 de março de 2012 da Agência Nacional de Vigilância Sanitária (ANVISA), é correto afirmar que:",o:["a limpeza inicial do artigo hospitalar deve ser realizada com substâncias corrosivas, como ácidos fortes, para garantir a remoção completa de resíduos orgânicos e inorgânicos","a escolha do método de esterilização deve ser exclusivamente baseada na complexidade do procedimento em que o artigo será utilizado, sem considerar as características do material do artigo","o armazenamento de artigos esterilizados pode ser feito em qualquer ambiente, desde que os artigos estejam em embalagens plásticas, sem a necessidade de condições de controle de temperatura e umidade","o processamento de artigos hospitalares deve ser feito com base na classificação de risco do item, sendo os artigos de risco alto ou médio submetidos à esterilização por autoclave ou outros métodos comprovadamente eficazes, enquanto artigos de risco baixo podem ser desinfetados por métodos químicos"],c:3,n:["Errada: ácidos fortes e corrosivos não são indicados para a limpeza.","Errada: o método considera a classificação de risco e as características do material.","Errada: o armazenamento exige condições controladas de ambiente.","Correta: o processamento segue a classificação de risco do artigo."],ref:"Anvisa, RDC nº 15/2012",dica:"Tema de vigilância sanitária, fora do edital do cargo de Assistente Social.",lv:"Difícil"},
{id:75,d:"Legislação (SUS)",a:"Decreto 7.508 – Regiões de Saúde",real:"Pref. Serra Alta/SC · Instituto EVO · 2025",q:"Quando se tratar de Regiões de Saúde, de acordo com o Decreto Federal de número 7.508/2011, assinale a alternativa correta:",o:["Poderão ser instituídas Regiões de Saúde intermunicipais, compostas por Municípios limítrofes, por ato conjunto dos respectivos Estados em articulação com os Municípios","Poderão ser instituídas Regiões de Saúde interestaduais, compostas por Municípios limítrofes, por ato conjunto dos respectivos Estados em articulação com os Municípios;","Poderão ser instituídas Regiões de Saúde interestaduais, compostas por Municípios regionais, por ato conjunto dos respectivos Estados em articulação com os Municípios;","Poderão ser instituídas Regiões de Saúde interestaduais, compostas por Municípios limítrofes, por ato conjunto dos respectivos Municípios em articulação com os Municípios."],c:0,n:["Gabarito exibido no QConcursos. ATENÇÃO: o art. 4º, §1º do Decreto fala em Regiões de Saúde interestaduais (alternativa B). Verifique o gabarito oficial da banca e se a questão foi anulada.","Reproduz o art. 4º, §1º do Decreto (interestaduais, por ato conjunto dos Estados). Diverge do gabarito exibido.","Errada: são Municípios limítrofes, não “regionais”.","Errada: o ato é conjunto dos Estados, não dos Municípios."],ref:"Decreto 7.508/2011, art. 4º, §1º",dica:"Gabarito suspeito: leia o art. 4º inteiro e, se for o caso, use o botão de sinalizar.",lv:"Difícil"},
{id:76,d:"Legislação (SUS)",a:"Complementar – Lei 13.595/2018 (ACS)",comp:1,real:"Pref. Mocajuba/PA · FADESP · 2025",q:"De acordo com a Lei nº 13.595/18, no modelo de atenção em saúde, fundamentado na assistência multiprofissional em saúde da família, o Agente Comunitário de Saúde que concluiu o curso técnico e tenha disponíveis os equipamentos adequados e com supervisão de profissionais de saúde de nível superior membro da equipe, poderá, em caráter excepcional, realizar",o:["administração de medicações na presença de receituário.","aferição da temperatura retal.","verificação antropométrica.","troca de curativos em lesões de pequena gravidade."],c:2,n:["Errada: não consta entre as atividades excepcionais do ACS.","Errada: a lei não prevê temperatura retal. Confira o texto.","Correta segundo o gabarito: verificação antropométrica.","Errada: não consta entre as atividades excepcionais do ACS."],ref:"Lei 13.595/2018 (confira o artigo e os incisos no texto vigente)",dica:"Tema de ACS, fora dos itens do edital para Assistente Social.",lv:"Difícil"},
{id:77,d:"Legislação (SUS)",a:"Lei 8.080 – princípios (universalidade)",real:"Pref. Cunha Porã/SC · FEPESE · 2025",q:"De acordo com a Lei nº 8.080/1990, que institui o SUS, qual é o princípio fundamental que garante o acesso universal e igualitário às ações e serviços de saúde, promovendo a equidade e considerando as necessidades específicas de populações vulneráveis?",o:["Unificação, centralizando a gestão no nível federal para uniformidade nacional.","Regionalização, priorizando ações isoladas em municípios sem articulação intersetorial.","Universalidade, assegurando atendimento integral a todos os cidadãos, independentemente de contribuição financeira ou condição social.","Integralidade, focando exclusivamente na prevenção de doenças, sem considerar o tratamento curativo.","Participação social, limitando o controle a profissionais de saúde sem envolvimento comunitário."],c:2,n:["Errada: o SUS é descentralizado, com direção única em cada esfera.","Errada: a regionalização exige articulação, não ações isoladas.","Correta: universalidade de acesso (art. 7º, I).","Errada: a integralidade abrange prevenção e tratamento.","Errada: a participação da comunidade envolve a sociedade, não só profissionais de saúde."],ref:"Lei 8.080/1990, art. 7º, I",dica:"Universalidade = acesso para todos. Palavras como “exclusivamente” e “limitando” marcam alternativas erradas.",lv:"Fácil"},
{id:78,d:"Legislação (SUS)",a:"Lei 8.080 – princípios doutrinários",real:"Pref. Japaraíba/MG · FUMARC · 2025",q:"São princípios doutrinários do SUS:",o:["Complementaridade, sustentabilidade e equidade.","Sustentabilidade, universalidade e equidade.","Universalidade, equidade e integralidade.","Universalidade, integralidade e sustentabilidade."],c:2,n:["Errada: complementaridade e sustentabilidade não são princípios doutrinários.","Errada: sustentabilidade não é princípio doutrinário.","Correta: universalidade, equidade e integralidade.","Errada: sustentabilidade não é princípio doutrinário."],ref:"CF/1988, arts. 196 e 198; Lei 8.080/1990, art. 7º",dica:"Doutrinários: universalidade, equidade, integralidade. Organizativos: regionalização, hierarquização, descentralização e participação.",lv:"Fácil"},
{id:79,d:"Serviço Social",a:"Complementar – Winnicott",comp:1,real:"Pref. Bombinhas/SC · 2025",q:"De acordo com a teoria Donald Woods Winnicott, o desenvolvimento emocional tem uma mola propulsora e deve ocorrer num ambiente facilitador de intensa sensibilidade e empatia com o bebê, Winnicott o descreve da seguinte maneira:",o:["A condição materna primária;","O complexo do próximo;","A comunicação verbal entre mãe-bebê;","A satisfação das necessidades instintivas."],c:0,n:["Correta segundo o gabarito. Em Winnicott o termo mais conhecido é “preocupação materna primária”.","Errada: o “complexo do próximo” é associado a Freud, não ao ambiente facilitador de Winnicott.","Errada: o foco é o ambiente sensível, não a comunicação verbal.","Errada: não descreve o ambiente facilitador."],ref:"Winnicott, teoria do desenvolvimento emocional primitivo",dica:"Tema de psicologia do desenvolvimento, fora do edital do cargo.",lv:"Médio"},
{id:80,d:"Legislação (SUS)",a:"Lei 8.080 – diretrizes organizativas",real:"Pref. Alto Rio Novo/ES · IDESG · 2025",q:"A organização do Sistema Único de Saúde é orientada por fundamentos normativos que estruturam a atenção à saúde no território nacional. Entre esses fundamentos, destacam-se diretrizes voltadas à organização da rede e princípios relacionados ao acesso e ao cuidado. Assinale a alternativa que apresenta diretriz expressamente prevista na legislação do SUS.",o:["Garantia de estrutura hierarquizada por faixa etária, com serviços exclusivos para determinadas populações.","Regionalização e hierarquização das ações e serviços como base da organização do sistema.","Adoção obrigatória do modelo hospitalocêntrico como referência para os fluxos assistenciais.","Limitação da universalidade conforme disponibilidade orçamentária municipal."],c:1,n:["Errada: a hierarquização é da rede por níveis de complexidade, não por faixa etária.","Correta: regionalização e hierarquização (Lei 8.080, art. 7º, IX, b; CF, art. 198).","Errada: o SUS não adota modelo hospitalocêntrico obrigatório.","Errada: a universalidade não se limita por orçamento municipal."],ref:"Lei 8.080/1990, art. 7º, IX, b; CF/1988, art. 198",dica:"Rede regionalizada e hierarquizada: está na CF e na Lei 8.080.",lv:"Médio"},
{id:81,d:"Raciocínio Lógico e Matemático",a:"Negação de proposições (De Morgan)",real:"QConcursos: banca e ano não aparecem no print",q:"Assinale a opção que apresenta a negação lógica da proposição “Amanda é fotógrafa ou George não é engenheiro”.",o:["Amanda não é fotógrafa ou George é engenheiro.","Amanda não é fotógrafa e George é engenheiro.","Amanda é fotógrafa e George é engenheiro.","Amanda não é fotógrafa e George não é engenheiro.","Amanda é fotógrafa ou George é engenheiro."],c:1,n:["Errada: nega as duas partes mas mantém o “ou”. Na negação, “ou” vira “e”.","Correta: ~(p ∨ ~q) = ~p ∧ q (De Morgan).","Errada: não nega o fato de Amanda ser fotógrafa.","Errada: George continua sendo negado como engenheiro, mas a negação exige que ele seja engenheiro.","Errada: mantém o “ou” e quase não altera a proposição original."],ref:"Lógica proposicional: leis de De Morgan",dica:"Negar “ou” vira “e”, e cada parte é negada.",lv:"Médio"},
{id:82,d:"Raciocínio Lógico e Matemático",a:"Sequências",real:"QConcursos: banca e ano não aparecem no print",q:"Os elementos da sequência de números abaixo seguem uma certa regra. 3, 7, 15, 31, 63, ... Continuando desse modo, o próximo termo é:",o:["119.","127.","128.","135.","139."],c:1,n:["Errada.","Correta: cada termo é o dobro do anterior mais 1. 63 × 2 + 1 = 127.","Errada: 128 é 2⁷. Os termos são 2ⁿ − 1.","Errada.","Errada."],ref:"Sequências numéricas",dica:"Cada termo = 2ª potência de 2 menos 1: 3, 7, 15, 31, 63, 127.",lv:"Fácil"},
{id:83,d:"Raciocínio Lógico e Matemático",a:"Interpretação de dados e raciocínio lógico",real:"QConcursos: banca e ano não aparecem no print",q:"A XXV ExpoCoité, realizada em setembro de 2026, reuniu atividades agropecuárias, comerciais, técnicas e culturais no Parque de Exposições de Conceição do Coité. Conforme o balanço divulgado pela administração municipal, o evento contou com 185 expositores, aproximadamente 40 mil visitantes, mais de 1.206 animais e movimentação financeira superior a R$ 30 milhões. Além das atividades agropecuárias, participaram representantes de segmentos como tecnologia, instituições financeiras, agricultura familiar, artesanato e comércio. Uma equipe de planejamento econômico examinou quatro interpretações: I. A presença de segmentos comerciais, financeiros e tecnológicos, juntamente com atividades agropecuárias, demonstra que a exposição possui abrangência econômica superior à comercialização de animais. II. O número de animais apresentados foi superior a seis vezes o quantitativo de expositores, embora os dados não permitam determinar a distribuição de animais por expositor. III. A movimentação financeira superior a R$ 30 milhões e o público aproximado de 40 mil visitantes permitem afirmar que o valor médio das transações econômicas realizadas por visitante foi necessariamente superior a R$ 750,00. IV. A participação de empresas de diferentes estados demonstra abrangência comercial que ultrapassa os limites de Conceição do Coité, mas não permite identificar, isoladamente, a participação de cada estado na movimentação financeira registrada. A interpretação tecnicamente adequada dos indicadores permite considerar corretas:",o:["I, II e IV, apenas.","I, II e III, apenas.","I, III e IV, apenas.","II, III e IV, apenas.","I, II, III e IV."],c:0,n:["Correta (gabarito): I, II e IV. A III é falsa.","Errada: a III é falsa.","Errada: a II é verdadeira e a III é falsa.","Errada: a I é verdadeira e a III é falsa.","Errada: a III é falsa."],ref:"Interpretação de dados: afirmações “necessariamente” exigem certeza",dica:"I: abrangência além dos animais. II: 6 × 185 = 1.110, e 1.206 é maior. III: 30 milhões ÷ 40 mil = 750, mas os dados são aproximados e “superior”, então não é necessariamente superior a 750. IV: o print do texto não mostra a menção a empresas de outros estados; o gabarito considera a IV correta.",lv:"Difícil"},
{id:84,d:"Raciocínio Lógico e Matemático",a:"Negação de proposições (De Morgan)",real:"QConcursos: banca e ano não aparecem no print",q:"Qual proposição representa a negação da afirmação: “Clara vai às compras e Sandra estuda”?",o:["Clara não vai às compras ou Sandra não estuda.","Clara vai às compras ou Sandra estuda.","Clara não vai às compras e Sandra não estuda.","Clara vai às compras e Sandra não estuda.","Clara não vai às compras e Sandra estuda."],c:0,n:["Correta: ~(p ∧ q) = ~p ∨ ~q (De Morgan).","Errada: não nega nenhuma das partes.","Errada: mantém o “e”. Na negação, “e” vira “ou”.","Errada: nega só uma parte e mantém o “e”.","Errada: nega só uma parte e mantém o “e”."],ref:"Lógica proposicional: leis de De Morgan",dica:"Negar “e” vira “ou”, e cada parte é negada.",lv:"Fácil"},
{id:85,d:"Legislação (SUS)",a:"Lei 8.080 – objetivos (art. 5º)",real:"QConcursos: banca e ano não aparecem no print",q:"A Lei 8.080, de 19 de setembro de 1990, no Art. 5° dispõe sobre os objetivos do Sistema Único de Saúde SUS: Analise a incorreta.",o:["- a identificação e divulgação dos fatores condicionantes e determinantes da saúde;","- a formulação de política de saúde destinada a promover, nos campos econômico e social, a observância do disposto no § 1° do art. 2° desta lei;","- participação, no âmbito de competência do Sistema Único de Saúde (SUS), em estudos, pesquisas, avaliação e controle dos riscos e agravos potenciais à saúde existentes no processo de trabalho.","- a assistência às pessoas por intermédio de ações de promoção, proteção e recuperação da saúde, com a realização integrada das ações assistenciais e das atividades preventivas."],c:2,n:["Objetivo do art. 5º, I.","Objetivo do art. 5º, II.","Correta (é a incorreta): é a participação em estudos e controle de riscos do processo de trabalho, que consta do art. 6º, §3º (saúde do trabalhador), e não do art. 5º.","Objetivo do art. 5º, III."],ref:"Lei 8.080/1990, art. 5º, I a III, e art. 6º, §3º",dica:"Art. 5º tem só três objetivos (I, II e III). Saúde do trabalhador está no art. 6º.",lv:"Difícil"},
{id:86,d:"Legislação (SUS)",a:"Organização do SUS – princípios e diretrizes (projeto societário)",real:"Pref. Ibirá/SP · PCN · 2023 (Assistente Social)",q:"De acordo com os Princípios e Diretrizes do Sistema Único de Saúde, é correto afirmar:",o:["a formação técnica dos agentes comunitários de saúde (ACS) não constitui atualmente um novo desafio para o SUS e para sociedade brasileira.","a consolidação do SUS depende também de um novo projeto societário, da superação das históricas iniquidades sociais e econômicas que persistem em existir no Brasil.","diversos interesses econômicos, políticos e culturais não podem estar em jogo na arena sociopolítica brasileira e, portanto, não podem colocam em disputa projetos sanitários e societários distintos, impedindo muitas vezes o avanço do SUS.","o trabalho dos ACS, e de todos os trabalhadores do SUS, não se institui como o desafio cotidiano de construção permanente, ao defender seus princípios e repensando as formas de sua materialização, sempre com base na participação e discussão individual."],c:1,n:["Errada: a formação técnica dos ACS é um desafio atual do SUS.","Correta: o SUS depende também de transformações sociais mais amplas e da superação das iniquidades.","Errada: nega que haja disputa de interesses, o que contradiz a ideia de projetos sanitários e societários em conflito.","Errada: a construção do SUS se dá pela participação coletiva, não individual."],ref:"Textos de Princípios e Diretrizes do SUS (Ministério da Saúde e literatura de Serviço Social e saúde)",dica:"Questão de Assistente Social: o SUS é projeto político e social em disputa. Desconfie de “não”, “não podem” e “individual”.",lv:"Difícil"},
{id:87,d:"Legislação (SUS)",a:"Saúde do Trabalhador – participação dos trabalhadores",real:"QConcursos: banca e ano não aparecem no print",q:"O programa de saúde de uma empresa inclui a proteção, a recuperação e a promoção da saúde de forma integrada e coletiva, ou seja, é direcionado não só aos trabalhadores que adoecem ou se acidentam, mas também ao conjunto deles. A abordagem da saúde do trabalhador possui um caráter transformador dos ambientes e dos processos de trabalho que torna imprescindível a(o)",o:["adesão dos investidores","cooperação dos prepostos","participação dos trabalhadores","concordância da alta administração","engajamento dos consumidores"],c:2,n:["Errada: investidores não são o sujeito da transformação.","Errada: prepostos representam o empregador.","Correta: a participação dos trabalhadores é central na saúde do trabalhador e no controle social.","Errada: a transformação não depende da concordância da alta administração.","Errada: consumidores não participam desse processo."],ref:"Política Nacional de Saúde do Trabalhador e da Trabalhadora (Portaria GM/MS nº 1.823/2012)",dica:"Saúde do trabalhador = o trabalhador é sujeito, com participação e controle social.",lv:"Médio"},
{id:88,d:"Legislação (SUS)",a:"Organização do SUS – características (CF/88)",real:"QConcursos: banca e ano não aparecem no print",q:"Considere o texto sobre o sistema de saúde no Brasil. A Constituição Federal, no capítulo da seguridade social, incorpora a visão do Movimento Sanitário, da saúde como direito universal e dever do Estado; as ações e os serviços de saúde como de relevância pública; a constituição de um sistema único de saúde com as seguintes características: universalidade, gratuidade e integralidade. (CAVALCANTI, L.; ZUCCO, L. Política de saúde e serviço social. In. REZENDE, I.; CAVALCANTI, L. (Org.). Serviço Social e Políticas Sociais. Rio de Janeiro: UFRJ, 2006, p.71.) Além dos aspectos mencionados, o Sistema Único de Saúde apresenta a seguinte característica própria:",o:["organização centralizada","prioridade de atividades preventivas","exclusão da iniciativa privada","supressão de entidades filantrópicas","financiamento exclusivamente federal"],c:1,n:["Errada: o SUS é descentralizado.","Correta: atendimento integral, com prioridade para as atividades preventivas (CF, art. 198, II).","Errada: a iniciativa privada participa de forma complementar (CF, art. 199).","Errada: as entidades filantrópicas têm preferência na participação complementar.","Errada: o financiamento é tripartite (CF, art. 198, §1º)."],ref:"CF/1988, arts. 196 a 199",dica:"Diretrizes do art. 198: descentralização, atendimento integral com prioridade para a prevenção e participação da comunidade.",lv:"Fácil"},
