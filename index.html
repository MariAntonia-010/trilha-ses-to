{id:89,d:"Serviço Social",a:"CFESS – Serviço Social na saúde (gênero e saúde)",real:"USP · FUVEST · 2026 (Residência Uniprofissional e Multiprofissional – Serviço Social)",q:"No Dicionário Crítico do Serviço Social na Saúde (2024), encontra-se um texto que discorre sobre gênero e saúde. A autora enfatiza os desdobramentos de uma atuação que considere o gênero na análise dos problemas de saúde das mulheres e sugere “uma nova relação profissional de saúde-usuárias na direção da desconstrução das desigualdades de gênero” (p. 254). Afirma ainda que é necessária a mudança da lógica patriarcal na saúde além de uma nova postura de trabalho das equipes de saúde garantindo a",o:["integralidade da atenção.","abordagem paliativa.","manifestação de terceiros.","reprodução assistida.","confraternidade feminina."],c:0,n:["Correta (gabarito oficial da banca): mudar a lógica patriarcal e a relação profissional-usuária pede uma atenção integral, que considere a mulher em suas condições de vida e não só a queixa clínica.","Errada: cuidados paliativos não têm relação com a desconstrução das desigualdades de gênero.","Errada: “manifestação de terceiros” não é um princípio ou diretriz do cuidado em saúde.","Errada: reprodução assistida é uma técnica específica, não uma postura de trabalho das equipes.","Errada: confraternidade feminina não é diretriz de atenção em saúde."],ref:"Dicionário Crítico do Serviço Social na Saúde (2024); CF/1988, art. 198, II; Lei 8.080/1990, art. 7º, II",dica:"Em questões sobre postura de equipe e SUS, integralidade costuma ser a resposta. Questão de residência: o texto vem de bibliografia específica de Serviço Social na saúde.",lv:"Médio"},
{id:90,d:"Serviço Social",a:"CFESS – Acolhimento e instrumentos técnico-operativos",real:"USP · FUVEST · 2026 (Residência Uniprofissional e Multiprofissional – Serviço Social)",q:"De acordo com Chupel e Mioto (2015), o acolhimento é parte integrante do processo interventivo da/o assistente social, reunindo, de forma concomitante, escuta, troca de informações e conhecimento da situação do usuário, com a finalidade de favorecer o acesso a direitos, construir vínculo, fomentar intervenções futuras e responder às necessidades dos usuários de determinado serviço. As autoras também destacam que esse momento exige domínio de instrumentais como a entrevista, além de conhecimento dos fundamentos teórico-metodológicos e princípios ético-políticos da profissão, das normativas da saúde e da rede de proteção social. Com base na análise das autoras sobre o acolhimento no campo da saúde, é correto afirmar:",o:["O acolhimento consiste, primordialmente, em uma etapa de recepção administrativa do usuário, voltada à organização do fluxo institucional e à triagem inicial, não integrando o núcleo propriamente a intervenção do Serviço Social.","O acolhimento configura-se como procedimento técnico padronizado, centrado na coleta objetiva de dados, cuja finalidade principal é classificar demandas segundo critérios institucionais de elegibilidade e racionalidade gerencial.","O acolhimento, no âmbito do Serviço Social, constitui momento integrante do processo interventivo profissional, no qual se articulam escuta, troca de informações e conhecimento da situação vivida pelo usuário, com vistas à criação de vínculo, à identificação de necessidades, ao acesso a direitos e à construção de respostas orientadas pelo princípio da integralidade.","O acolhimento deve ser compreendido como atribuição comum a todas as profissões da saúde, razão pela qual sua operacionalização pela/o assistente social prescinde de fundamentos teórico-metodológicos, princípios ético-políticos da profissão, bem como, não consiste em intervenção de relevância para o campo profissional.","O acolhimento tem como finalidade principal promover adesão comportamental do usuário às normas institucionais e às orientações clínicas, subordinando o atendimento social às exigências de disciplinamento do acesso aos serviços."],c:2,n:["Errada: contradiz o enunciado, que diz que o acolhimento é parte integrante do processo interventivo.","Errada: reduz o acolhimento a coleta de dados e classificação por elegibilidade, o oposto de escuta, vínculo e acesso a direitos.","Correta: reproduz a ideia central das autoras (escuta, vínculo, necessidades, direitos e integralidade).","Errada: o acolhimento exige fundamentos teórico-metodológicos e ético-políticos e tem relevância para a profissão.","Errada: a finalidade não é disciplinar ou garantir adesão, e sim ampliar o acesso a direitos."],ref:"Chupel e Mioto (2015); CFESS, Parâmetros para a Atuação de Assistentes Sociais na Política de Saúde (2010)",dica:"Em questões de acolhimento, a alternativa certa costuma repetir os verbos do enunciado (escuta, vínculo, direitos, integralidade). Desconfie de palavras como “primordialmente”, “prescinde” e “disciplinamento”.",lv:"Médio"}];

leg(){M.onclick=null;M.innerHTML=`<h2>Legislação</h2><p class="mu">Links para o texto oficial no Planalto. A conferência da redação vigente (e a data de verificação) ainda está pendente: confirme no link antes de estudar.</p>${LEIS.map(l=>`<div class="card"><a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a><br><span class="tag">${l[2]?"Exigida no edital":"Complementar (não consta no edital)"}</span><span class="tag">verificada em: pendente</span></div>`).join("")}<p class="mu">Também constam do edital: Política Nacional de Humanização e Política Nacional de Saúde do Trabalhador e da Trabalhadora (textos oficiais a incluir).</p>`},
ref(){M.onclick=null;const P="https://www.planalto.gov.br/ccivil_03/";const G=[["Edital e concurso",[["FGV Conhecimento (provas e editais)","https://conhecimento.fgv.br/","Site da banca. Provas anteriores em PDF, gabaritos e avisos do concurso."],["Edital 001/2026 SECAD/SES/TO (minuta, PDF)","https://conhecimento.fgv.br/sites/default/files/concursos/minuta-do-edital-ses-to-vf.pdf","Texto que usei para o edital verticalizado. Confirme se bate com o publicado no Diário Oficial."],["Retificação nº 001 (PDF)","https://conhecimento.fgv.br/sites/default/files/concursos/edital-de-retificacao-001-concurso-saude-assinado.pdf","Altera o item 16 de Assistente Social. Leia o texto completo."],["Diário Oficial do Estado do Tocantins","https://diariooficial.to.gov.br/","Publicação oficial de editais, retificações e convocações."],["Governo do Tocantins","https://www.to.gov.br/","Portal do Estado. Procure a Secretaria da Saúde para avisos do concurso."]]],["Legislação (texto oficial no Planalto)",[["Constituição Federal de 1988",P+"constituicao/constituicao.htm","Saúde: arts. 196 a 200. Seguridade: art. 194 e seguintes."],["Lei 8.080/1990 (Lei Orgânica da Saúde)",P+"leis/l8080.htm","Exigida no edital."],["Lei 8.142/1990 (participação e transferências)",P+"leis/l8142.htm","Exigida no edital."],["Decreto 7.508/2011",P+"_ato2011-2014/2011/decreto/d7508.htm","Exigido no edital."],["Lei 8.662/1993 (profissão de Assistente Social)",P+"leis/l8662.htm","Competências e atribuições privativas."],["Lei 8.069/1990 (ECA)",P+"leis/l8069.htm","Estatuto da Criança e do Adolescente."],["Lei 8.742/1993 (LOAS)",P+"leis/l8742.htm","Assistência social, SUAS e BPC."],["Lei 8.842/1994 (Política Nacional do Idoso)",P+"leis/l8842.htm","Consta no edital."],["Lei 10.741/2003 (Estatuto da Pessoa Idosa)",P+"leis/2003/l10.741.htm","Complementar à Política Nacional do Idoso."],["Lei 13.146/2015 (Estatuto da Pessoa com Deficiência)",P+"_ato2015-2018/2015/lei/l13146.htm","Complementar ao item de pessoa com deficiência."],["Lei Complementar 141/2012",P+"leis/lcp/lcp141.htm","Financiamento do SUS. Complementar, não consta no edital."]]],["SUS e saúde",[["Ministério da Saúde","https://www.gov.br/saude/pt-br","Portal oficial: políticas, programas e notícias."],["Biblioteca Virtual em Saúde (MS)","https://bvsms.saude.gov.br/","Portarias e políticas, como a PNH e a PNSTT. Busque pelo nome da política."],["SaúdeLegis","https://saudelegis.saude.gov.br/","Base de normas do Ministério da Saúde, como a Portaria 1.823/2012."],["Conselho Nacional de Saúde","https://conselho.saude.gov.br/","Controle social, resoluções e conferências de saúde."],["DATASUS","https://datasus.saude.gov.br/","Dados e indicadores do SUS."],["CONASS","https://www.conass.org.br/","Conselho Nacional de Secretários de Saúde (gestores estaduais)."],["CONASEMS","https://www.conasems.org.br/","Conselho Nacional de Secretarias Municipais de Saúde."],["Fiocruz","https://portal.fiocruz.br/","Pesquisa e materiais sobre saúde pública."]]],["Serviço Social e assistência social",[["CFESS","https://www.cfess.org.br/","Código de Ética, Lei 8.662 e Parâmetros para atuação na saúde."],["ABEPSS","https://www.abepss.org.br/","Associação de ensino e pesquisa em Serviço Social."],["Ministério do Desenvolvimento e Assistência Social","https://www.gov.br/mds/pt-br","SUAS, CRAS, CREAS, BPC e Bolsa Família."]]],["Dados e pesquisas",[["IBGE","https://www.ibge.gov.br/","Dados do Tocantins: população, biomas e território."],["IBGE Cidades","https://cidades.ibge.gov.br/","Perfil de municípios e do Estado."],["Inep","https://www.gov.br/inep/pt-br","Dados e pesquisas de educação. Não faz parte do edital."],["Ipea","https://www.ipea.gov.br/","Estudos sobre políticas públicas e proteção social."]]],["Treino com questões",[["QConcursos","https://www.qconcursos.com/","Banco de questões de provas anteriores. Exige cadastro e, para uso amplo, plano pago."],["Provas anteriores da FGV","https://conhecimento.fgv.br/","Procure por concursos já realizados e baixe o caderno de provas e o gabarito."]]]];const draw=t=>{$("#rl").innerHTML=G.map(g=>{const l=g[1].filter(x=>(x[0]+x[2]).toLowerCase().includes(t));return l.length?`<div class="card"><b>${g[0]}</b><ul>${l.map(x=>`<li><a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a><div class="mu">${x[2]}</div></li>`).join("")}</ul></div>`:""}).join("")||"<div class='card'>Nada encontrado.</div>"};M.innerHTML="<h2>Referências e pesquisas</h2><p class='mu'>Links para fontes oficiais. Confira sempre a redação vigente no site de origem. Alguns sites mudam de endereço: se um link falhar, busque o nome do documento no site raiz.</p><input id='rf' placeholder='Buscar (ex.: ECA, SUS, CFESS)' style='width:100%;box-sizing:border-box;margin-bottom:10px'><div id='rl'></div>";$("#rf").oninput=e=>draw(e.target.value.toLowerCase());draw("")},
au(){M.onclick=null;const AU=[["CF/1988: Da Saúde (arts. 196 a 200)","<b>Art. 196:</b> saúde é direito de todos e dever do Estado, com acesso universal e igualitário.<br><b>Art. 197:</b> ações e serviços de saúde têm relevância pública; cabe ao Poder Público regulamentar, fiscalizar e controlar.<br><b>Art. 198:</b> rede regionalizada e hierarquizada, formando um sistema único. Diretrizes: descentralização com direção única em cada esfera; atendimento integral, com prioridade para a prevenção; participação da comunidade. Financiamento tripartite (§1º).<br><b>Art. 199:</b> a assistência à saúde é livre à iniciativa privada; no SUS, participa de forma complementar.<br><b>Art. 200:</b> competências do SUS (vigilância sanitária e epidemiológica, saúde do trabalhador, formação de recursos humanos, saneamento, meio ambiente).<br><b>Erro comum:</b> trocar “complementar” por “substitutivo”."],["Lei 8.080/1990: Lei Orgânica da Saúde","<b>Art. 3º:</b> determinantes e condicionantes (alimentação, moradia, saneamento, meio ambiente, trabalho, renda, educação, atividade física, transporte, lazer, acesso a bens e serviços essenciais).<br><b>Art. 7º, princípios:</b> universalidade; integralidade; preservação da autonomia; igualdade da assistência; direito à informação; participação da comunidade; descentralização com direção única; regionalização e hierarquização.<br><b>Erro comum:</b> confundir integralidade (conjunto articulado de ações em todos os níveis) com universalidade (acesso de todos)."],["Lei 8.142/1990: participação e controle social","<b>Instâncias colegiadas:</b> Conferência de Saúde e Conselho de Saúde.<br><b>Conferência:</b> reúne-se a cada 4 anos, avalia a situação de saúde e propõe diretrizes.<br><b>Conselho:</b> permanente e deliberativo; composto por governo, prestadores, profissionais de saúde e usuários; atua na formulação de estratégias e no controle da execução da política, inclusive nos aspectos econômicos e financeiros.<br><b>Paridade:</b> a representação dos usuários é paritária em relação ao conjunto dos demais segmentos.<br><b>Repasses:</b> exigem Fundo de Saúde, Conselho de Saúde, plano de saúde e relatório de gestão."],["Decreto 7.508/2011","<b>Art. 2º, definições:</b> Região de Saúde; COAP (acordo entre entes federativos); Portas de Entrada; Comissões Intergestores; Mapa da Saúde; Rede de Atenção à Saúde; Protocolo Clínico e Diretriz Terapêutica.<br><b>Portas de entrada:</b> atenção primária, urgência e emergência, atenção psicossocial e serviços especiais de acesso aberto.<br><b>Comissões Intergestores:</b> CIT (tripartite), CIB (bipartite) e CIR (regional).<br><b>Dica:</b> a FGV costuma cobrar a definição literal do art. 2º."],["Código de Ética: sigilo profissional","<b>Regra:</b> o sigilo protege o usuário em tudo de que o assistente social tome conhecimento no exercício profissional; é vedado revelá-lo.<br><b>Exceção (art. 18):</b> a quebra só é admissível em situações de gravidade que possam trazer prejuízo aos interesses do usuário, de terceiros e da coletividade, envolvendo ou não fato delituoso.<br><b>Limite:</b> a revelação é feita dentro do estritamente necessário, quanto ao assunto e às pessoas que devam conhecê-lo.<br><b>Erro comum:</b> achar que ordem de autoridade ou do empregador autoriza a quebra automaticamente."],["Lei 8.662/1993: competências e atribuições privativas","<b>Art. 4º (competências):</b> elaborar e executar políticas sociais; planejar programas e projetos; encaminhar providências e prestar orientação social a indivíduos, grupos e população; entre outras.<br><b>Art. 5º (privativas):</b> coordenar e avaliar estudos, pesquisas, planos, programas e projetos de Serviço Social; planejar e administrar benefícios e serviços sociais; assessoria e consultoria; vistorias, perícias técnicas, laudos periciais, informações e pareceres sobre matéria de Serviço Social; treinamento e supervisão direta de estagiários; direção e supervisão de unidades de ensino.<br><b>Erro comum:</b> dar como privativa uma atividade que é só competência."]];M.innerHTML="<h2>Resumos</h2><p class='mu'>Resumos autorais dos temas mais cobrados. Revisão jurídica ainda pendente: confira a redação no link oficial da aba Legislação antes de decorar.</p>"+AU.map(a=>`<details class="card"><summary>${a[0]}</summary><p>${a[1]}</p></details>`).join("")},
q(){M.onclick=null;const F=window.QF=window.QF||{d:"",t:"",o:""};const th=[...new Set(Q.map(TM))];const cnt=t=>Q.filter(x=>TM(x)===t).length;const l=Q.filter(x=>(!F.d||x.d===F.d)&&(!F.t||TM(x)===F.t)&&(!F.o||(F.o==="real"?!!x.real:!x.real)));
M.innerHTML=`<h2>Banco de questões</h2><p class="mu">${Q.length} questões: ${Q.filter(x=>x.real).length} de provas reais e ${Q.filter(x=>!x.real).length} autorais (nenhuma autoral é da FGV).</p><div class="chips"><button class="chip ${F.t?"":"on"}" data-t="">Todos os conteúdos (${Q.length})</button>${th.map(t=>`<button class="chip ${F.t===t?"on":""}" data-t="${t}">${t} (${cnt(t)})</button>`).join("")}</div><div class="filters"><select id="fd"><option value="">Todas as disciplinas</option>${DK.map(d=>`<option ${d===F.d?"selected":""}>${d}</option>`).join("")}</select><select id="fo"><option value="">Reais e autorais</option><option value="real" ${F.o==="real"?"selected":""}>Só provas reais</option><option value="aut" ${F.o==="aut"?"selected":""}>Só autorais</option></select></div><div class="mu">${l.length} questão(ões) neste filtro</div><div id="ql"></div>`;
$("#fd").onchange=e=>{F.d=e.target.value;R.q()};$("#fo").onchange=e=>{F.o=e.target.value;R.q()};M.onclick=e=>{const c=e.target.closest(".chip");if(c){F.t=c.dataset.t;R.q()}};qs($("#ql"),l)},
sta(){M.onclick=null;M.innerHTML=`<h2>Status e pendências</h2><div class="card"><b>Implementado</b><ul><li>Painel, edital verticalizado com status e % de conclusão, banco de questões com gabarito comentado e filtro, simulados cronometrados, caderno de erros, flashcards com revisão espaçada, cronograma e modo claro/escuro com ajuste de fonte.</li><li>Dados salvos automaticamente neste navegador (localStorage).</li></ul></div>
<div class="card warn"><b>Pontos do edital que exigem conferência</b><ul><li>O PDF lido no site da FGV se chama “minuta”. Confirme se é idêntico ao publicado no Diário Oficial nº 7.111.</li><li>Item 11.14 diz mínimo de 24 pts (40%) no Módulo II; o item 15.1 diz 30 pts (50%). O edital se contradiz. Mire o maior (30) até uma retificação esclarecer.</li><li>A Retificação nº 001 alterou o item 16 de Assistente Social; li só o início do texto novo.</li><li>Fontes secundárias divergem sobre vagas (151, 180 e 221) e sobre o fim das inscrições (10 ou 17/09). Não usei esses números.</li></ul></div>
<div class="card"><b>Provas anteriores</b><ul><li>O QConcursos exige login e pagamento, e copiar o acervo em massa não é permitido. Pesquisei o que a FGV cobra de Assistente Social e escrevi questões novas sobre os mesmos temas.</li><li>Temas recorrentes: sigilo profissional (art. 18 do Código), direitos, deveres e vedações; Lei 8.662 (arts. 4º e 5º); Lei 8.080 (art. 3º e determinantes); LOAS; ECA; instrumentos como o plano; Parâmetros do CFESS na saúde.</li><li>As questões de provas reais (ids 51 a 90) foram transcritas dos prints que você enviou, com órgão, banca e ano quando aparecem. As marcadas como complementares não constam do edital e ficam fora dos simulados. Os comentários são meus, não do QConcursos. Provas completas da FGV: conhecimento.fgv.br.</li></ul></div><div class="card"><b>Pendente (não implementado)</b><ul><li>Autenticação e banco de dados (Supabase): este ambiente não oferece servidor. Os dados ficam só neste aparelho.</li><li>Aulas completas (existem só 6 resumos curtos) e 10+ questões por assunto: só ${Q.length} questões existem hoje, de ${ED.reduce((a,e)=>a+e.it.length,0)} itens do edital. Cobertura do edital: muito baixa.</li><li>Tutor de IA (exige chave protegida em servidor), área administrativa, importação, contestação de questão, notas e favoritos, legislação comentada artigo a artigo, ciclos configuráveis.</li></ul></div>`}};
function qs(box,l,er){box.innerHTML=l.map(x=>`<div class="card" id="c${x.id}"><span class="tag ${x.real?"real":""}">${x.real?"Prova real · "+x.real:"Autoral (não é da FGV)"}</span><span class="tag">${x.d}</span><span class="tag">${x.lv}</span><div class="mu">${x.a}</div><p>${x.q}</p>${x.o.map((t,i)=>`<button class="opt" data-q="${x.id}" data-i="${i}">${"ABCDE"[i]}) ${t}</button>`).join("")}<div class="ex"></div></div>`).join("");
box.onclick=e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const x=Q.find(z=>z.id==b.dataset.q),i=+b.dataset.i,c=$("#c"+x.id),ok=i===x.c;c.querySelectorAll(".opt").forEach((o,k)=>{o.disabled=true;if(k===x.c)o.classList.add("ok");else if(k===i)o.classList.add("no")});
c.querySelector(".ex").innerHTML=`<b>${ok?"Acertou":"Errou"}. Gabarito: ${"ABCDE"[x.c]}</b><ul>${x.n.map((t,k)=>`<li>${"ABCDE"[k]}) ${t}</li>`).join("")}</ul><div class="mu">Referência: ${x.ref}<br>Dica: ${x.dica}</div><button class="b s" onclick="this.textContent='Sinalizada, obrigado'">Sinalizar problema</button>`;
st.ans.push({id:x.id,d:x.d,ok});if(!ok)st.err[x.id]=0;else if(x.id in st.err){st.err[x.id]++;if(st.err[x.id]>=2)delete st.err[x.id]}sv()}}
let tm;function runSim(n,tr){const l=[...Q.filter(x=>!x.comp)].sort(()=>Math.random()-.5).slice(0,n),rs={};let left=l.length*240,pa=false;clearInterval(tm);
const A=$("#sa");A.innerHTML=`<div class="card"><b id="tt"></b> ${tr?'<button class="b s" id="pz">Pausar</button>':""}</div>`+l.map((x,k)=>`<div class="card"><p><b>${k+1}.</b> ${x.q}</p>${x.o.map((t,i)=>`<label style="display:block;margin:5px 0"><input type="radio" name="s${x.id}" value="${i}"> ${"ABCDE"[i]}) ${t}</label>`).join("")}</div>`).join("")+`<button class="b" id="en">Enviar e corrigir</button><div id="rs"></div>`;
const fm=()=>{$("#tt").textContent="Tempo restante: "+Math.floor(left/60)+" min "+(left%60)+" s"};fm();const fin=()=>{clearInterval(tm);let p=0,m=0,k=0;const pd={};l.forEach(x=>{const r=document.querySelector(`input[name=s${x.id}]:checked`),ok=r&&+r.value===x.c,w=PT(x.d);m+=w;pd[x.d]=pd[x.d]||[0,0];pd[x.d][1]++;if(ok){p+=w;k++;pd[x.d][0]++}st.ans.push({id:x.id,d:x.d,ok:!!ok});if(!ok)st.err[x.id]=0});st.sim.push({dt:new Date().toLocaleString("pt-BR"),p,m,k,n:l.length});sv();$("#rs").innerHTML=`<div class="card"><div class="big">${p}/${m} pts</div>${k}/${l.length} acertos · tempo médio ${Math.round((l.length*240-left)/l.length)} s por questão<ul>${Object.entries(pd).map(([d,v])=>`<li>${d}: ${v[0]}/${v[1]}</li>`).join("")}</ul>Erros foram para o caderno de erros.</div>`;$("#en").hidden=true};
const tick=()=>{tm=setInterval(()=>{if(!pa&&--left<=0)fin();else fm()},1000)};tick();$("#en").onclick=fin;if(tr)$("#pz").onclick=e=>{pa=!pa;e.target.textContent=pa?"Retomar":"Pausar"}}
go("dash");
</script></body></html>
